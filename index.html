<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우주여행 시간 지연 계산기</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <header class="app-header">
    <h1>우주여행 시간 지연 계산기</h1>
    <p class="app-subtitle">지구에서 출발한 우주선의 속도와 거리에 따른 시간 지연을 생물의 수명과 비교합니다.</p>
  </header>

  <main class="app-main">
    <!-- 1단계: 출발 위치(발사장) 선택 -->
    <section class="panel" id="launch-site-panel">
      <h2>1. 출발 위치 (발사장)</h2>
      <div id="launch-site-selector"></div>
    </section>

    <!-- 2단계: 목적지(천체) 선택 -->
    <section class="panel" id="destination-panel">
      <h2>2. 목적지 (천체)</h2>
      <div id="destination-selector"></div>
    </section>

    <!-- 3단계: 속도 슬라이더, 프리셋, 로런츠 인자 -->
    <section class="panel" id="speed-panel">
      <h2>3. 우주선 속도</h2>
      <div id="speed-slider-container"></div>
      <div id="speed-presets-container"></div>
      <div id="lorentz-container"></div>
    </section>

    <!-- 4단계: 여행 형태(편도/왕복). 계산 결과 표시는 5단계에서 추가된다 -->
    <section class="panel" id="trip-panel">
      <h2>4. 여행 형태</h2>
      <div id="trip-type-container"></div>
    </section>

    <!-- 5단계: 결과 수치 표 -->
    <section class="panel" id="result-panel">
      <h2>5. 계산 결과</h2>
      <div id="result-table-container"></div>
    </section>

    <!-- 6단계 이후의 구성 요소는 여기에 순서대로 추가된다 -->
  </main>

  <footer class="app-footer">
    <p>단계별 개발 중 · 현재 5단계(결과 표) · <a href="tests/physics.test.html">계산 검증 페이지</a></p>
  </footer>

  <!-- ES 모듈 진입점. file:// 로 열면 동작하지 않으므로 로컬 서버로 연다 (docs/02_architecture.md 5절) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
