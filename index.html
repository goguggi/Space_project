<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우주여행 시간 지연 계산기</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <!-- 15단계 레이아웃 (D-54): 3D 장면이 화면 전체 바탕, 오른쪽에 제어 패널이 겹쳐 뜬다 -->
  <div class="app">

    <!-- ── 무대: 발사 장면과 항행 장면이 같은 자리에서 번갈아 보인다 ── -->
    <section class="stage" id="stage">
      <div id="launch-scene" class="scene-layer"></div>
      <div id="cruise-scene" class="scene-layer"></div>
      <div id="landing-scene" class="scene-layer"></div>

      <!-- 계기판 겹침 층 (마우스 이벤트는 통과시키고, 버튼만 받는다) -->
      <div id="launch-hud" class="hud-layer"></div>
      <div id="cruise-hud" class="hud-layer"></div>
      <div id="view-controls" class="hud-layer"></div>

      <header class="stage-top">
        <h1>우주여행 시간 지연 계산기</h1>
        <p id="stage-subtitle">발사장과 목적지, 속도를 고르고 발사하세요.</p>
      </header>

      <div class="stage-bottom">
        <div id="mission-chapters"></div>
        <div id="mission-bar-container"></div>
      </div>

      <button type="button" class="panel-toggle" id="panel-toggle" aria-label="제어 패널 접기/펼치기">☰</button>
    </section>

    <!-- ── 제어 패널 ── -->
    <aside class="panel" id="panel">
      <div class="panel-scroll">

        <section class="card">
          <h2><span class="card-index">01</span> 발사장</h2>
          <div id="launch-site-selector"></div>
          <div id="launch-site-map"></div>
        </section>

        <section class="card">
          <h2><span class="card-index">02</span> 목적지</h2>
          <div id="destination-selector"></div>
        </section>

        <section class="card">
          <h2><span class="card-index">03</span> 속도</h2>
          <div id="speed-slider-container"></div>
          <div id="speed-presets-container"></div>
          <div id="lorentz-container"></div>
          <div id="lorentz-chart-container"></div>
        </section>

        <section class="card">
          <h2><span class="card-index">04</span> 여행 형태</h2>
          <div id="trip-type-container"></div>
        </section>

        <section class="card card-result">
          <h2><span class="card-index">05</span> 시계</h2>
          <div id="stopwatch-container"></div>
        </section>

        <section class="card card-result">
          <h2><span class="card-index">06</span> 계산 결과</h2>
          <div id="result-table-container"></div>
        </section>

        <section class="card card-result">
          <h2><span class="card-index">07</span> 생물 수명과 비교</h2>
          <div id="departure-age-container"></div>
          <div id="lifespan-chart-container"></div>
          <div id="survival-container"></div>
        </section>

        <footer class="panel-footer">
          <p>20단계 · <a href="tests/physics.test.html">계산 검증 페이지</a></p>
        </footer>
      </div>
    </aside>
  </div>

  <!-- Three.js 부속 모듈(OrbitControls 등)이 'three'라는 이름으로 본체를 찾으므로 그 이름을 동봉 파일에 연결한다 -->
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.js" } }
  </script>
  <!-- ES 모듈 진입점. file:// 로 열려면 `열기.html`을 쓴다 (docs/02_architecture.md 5절) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
