<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우주여행 시간 지연 계산기</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <header class="app-header">
    <h1>우주여행 시간 지연 계산기</h1>
    <p class="app-subtitle">지구에서 출발한 우주선의 속도와 거리에 따른 시간 지연을 생물의 수명과 비교합니다.</p>
  </header>

  <main class="app-main">
    <!-- 1단계: 출발 위치(발사장) 선택 -->
    <section class="panel" id="launch-site-panel">
      <h2>1. 출발 위치 (발사장)</h2>
      <div id="launch-site-selector"></div>
    </section>

    <!-- 2단계: 목적지(천체) 선택 -->
    <section class="panel" id="destination-panel">
      <h2>2. 목적지 (천체)</h2>
      <div id="destination-selector"></div>
    </section>

    <!-- 3단계: 속도 슬라이더, 프리셋, 로런츠 인자 -->
    <section class="panel" id="speed-panel">
      <h2>3. 우주선 속도</h2>
      <div id="speed-slider-container"></div>
      <div id="speed-presets-container"></div>
      <div id="lorentz-container"></div>
    </section>

    <!-- 4단계: 여행 형태(편도/왕복). 계산 결과 표시는 5단계에서 추가된다 -->
    <section class="panel" id="trip-panel">
      <h2>4. 여행 형태</h2>
      <div id="trip-type-container"></div>
    </section>

    <!-- 5단계: 결과 수치 표 -->
    <section class="panel" id="result-panel">
      <h2>5. 계산 결과</h2>
      <div id="result-table-container"></div>
    </section>

    <!-- 6단계: 스톱워치 애니메이션 -->
    <section class="panel" id="stopwatch-panel">
      <h2>6. 스톱워치</h2>
      <div id="stopwatch-container"></div>
    </section>

    <!-- 7단계: 생물 수명 비교 -->
    <section class="panel" id="lifespan-panel">
      <h2>7. 생물 수명과 비교</h2>
      <div id="departure-age-container"></div>
      <div id="lifespan-chart-container"></div>
      <div id="survival-container"></div>
    </section>

    <!-- 10단계: 3D 발사 장면 (Three.js). 11단계부터 로켓과 발사 물리가 붙는다 -->
    <section class="panel" id="launch-panel">
      <h2>발사 장면 (3D)</h2>
      <p class="field-label">마우스 드래그로 시점 회전, 휠로 확대·축소. 로켓은 11단계에서 추가됩니다.</p>
      <div id="launch-scene" class="launch-scene"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>단계별 개발 중 · 현재 10단계(3D 장면) · <a href="tests/physics.test.html">계산 검증 페이지</a></p>
  </footer>

  <!-- Three.js 부속 모듈(OrbitControls 등)이 'three'라는 이름으로 본체를 찾으므로 그 이름을 동봉 파일에 연결한다 -->
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.js" } }
  </script>
  <!-- ES 모듈 진입점. file:// 로 열면 동작하지 않으므로 로컬 서버로 연다 (docs/02_architecture.md 5절) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
