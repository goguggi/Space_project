# GitHub Pages 자동 게시
# main 브랜치에 푸시할 때마다 저장소 최상위(index.html)를 그대로 Pages에 올린다.
# configure-pages의 enablement 옵션이 Pages를 자동으로 켜므로 저장소 설정 화면을 만질 필요가 없다.
# 게시 주소: https://goguggi.github.io/Space_project/

name: GitHub Pages 게시

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Pages 설정 (꺼져 있으면 자동으로 켬)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 사이트 파일 묶기 (저장소 최상위 전체)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 게시
        id: deployment
        uses: actions/deploy-pages@v4
