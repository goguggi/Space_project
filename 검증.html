  // 각 모듈을 Blob URL로 만들고, import 경로를 그 URL로 바꿔 끼운 뒤 진입점을 불러온다.
  (function () {
    var SOURCES = {"tests/physics.test.js": "// 계산 검증 (4단계). physics.test.html이 불러온다.\n// 기준값: docs/03_physics.md 5절\n// 외부 테스트 도구 없이, 표에 통과/실패를 표시한다.\n\nimport { SPEED_OF_LIGHT, LIGHT_YEAR, SECONDS_PER_YEAR } from \"__MOD__src/data/constants.js__END__\";\nimport { gamma, gammaMinusOne } from \"__MOD__src/physics/lorentz.js__END__\";\nimport { computeTimeDilation, TRIP_TYPES } from \"__MOD__src/physics/timeDilation.js__END__\";\nimport { circularOrbitSpeed, createLaunchSimulation } from \"__MOD__src/physics/launchDynamics.js__END__\";\nimport { buildRoute, legDistance } from \"__MOD__src/physics/route.js__END__\";\nimport { ageGap, bestEquivalent } from \"__MOD__src/physics/ageGap.js__END__\";\nimport { ORGANISMS as AGE_ORGANISMS } from \"__MOD__src/data/organisms.js__END__\";\nimport { FALCON_HEAVY } from \"__MOD__src/data/falconHeavy.js__END__\";\nimport { selectLandingTarget, bodyAltitude } from \"__MOD__src/launch/landingTarget.js__END__\";\nimport { journeyAt, angularRadius, dopplerFactor, aberratedAngle, beta } from \"__MOD__src/physics/journey.js__END__\";\nimport { descentProfile } from \"__MOD__src/physics/landingGuidance.js__END__\";\nimport { CELESTIAL_BODIES, isLandable } from \"__MOD__src/data/celestialBodies.js__END__\";\nimport { travelDurationSeconds } from \"__MOD__src/physics/journey.js__END__\";\nimport { missionChapters, currentChapter } from \"__MOD__src/physics/missionTimeline.js__END__\";\nimport { LANDING_STEPS, activeStep, missedSteps, descentPenalty, landingGrade, aimBonus } from \"__MOD__src/physics/landingMission.js__END__\";\nimport { DESTINATIONS } from \"__MOD__src/data/destinations.js__END__\";\nimport { ASCENT_STEPS, reachedSteps, nextStep, ascentProgress } from \"__MOD__src/physics/ascentMission.js__END__\";\nimport { judgeTouchdown, TOUCHDOWN_LIMIT } from \"__MOD__src/physics/landingMission.js__END__\";\nimport { EXPLORATION_TASKS, walkParameters, taskInReach, nearestTask, explorationScore } from \"__MOD__src/physics/exploration.js__END__\";\nimport { STANDARD_GRAVITY, EARTH_RADIUS } from \"__MOD__src/data/constants.js__END__\";\n\nconst c = SPEED_OF_LIGHT;\n\n// 각 항목: 이름, 기대값, 계산값, 상대 허용 오차\nconst cases = [\n  ['γ, v = 0.99c', 7.0888, gamma(0.99 * c), 1e-4],\n  ['γ, v = 0.9c', 2.2942, gamma(0.9 * c), 1e-4],\n  ['γ, v = 0.5c', 1.1547, gamma(0.5 * c), 1e-4],\n  ['γ, v = 0.1c', 1.005038, gamma(0.1 * c), 1e-5],\n  ['γ − 1, v = 11.2 km/s', 6.98e-10, gammaMinusOne(11_200), 2e-3],\n  ['급수/직접 계산 경계 연속성 (β = 10⁻³ 전후)', gammaMinusOne(0.999e-3 * c), gammaMinusOne(1.001e-3 * c), 5e-3],\n];\n\n// 프록시마 4.246 ly, 0.99c, 편도\nconst proxima = computeTimeDilation({ distance: 4.246 * LIGHT_YEAR, speed: 0.99 * c });\ncases.push(['프록시마 편도 지구 시간 (년)', 4.289, proxima.earthTime / SECONDS_PER_YEAR, 1e-3]);\ncases.push(['프록시마 편도 우주선 시간 (년)', 0.605, proxima.shipTime / SECONDS_PER_YEAR, 2e-3]);\n\n// 달 384,400 km, 11.2 km/s, 편도\nconst moon = computeTimeDilation({ distance: 384_400_000, speed: 11_200 });\ncases.push(['달 편도 지구 시간 (시간)', 9.53, moon.earthTime / 3600, 1e-3]);\ncases.push(['달 편도 시간 차이 (마이크로초)', 24, moon.difference * 1e6, 2e-2]);\n\n// 왕복 = 편도 × 2\nconst moonRound = computeTimeDilation({ distance: 384_400_000, speed: 11_200, tripType: TRIP_TYPES.ROUND_TRIP });\ncases.push(['달 왕복 지구 시간 = 편도 × 2', moon.earthTime * 2, moonRound.earthTime, 1e-12]);\ncases.push(['달 왕복 차이 = 편도 × 2', moon.difference * 2, moonRound.difference, 1e-12]);\n\n// 정밀도: 낮은 속도에서 직접 빼기와 급수 계산의 차이가 작아야 한다 (자릿수 유지 확인)\ncases.push(['차이 정밀 계산 vs 직접 빼기 (11.2 km/s, 달)', moon.earthTime - moon.shipTime, moon.difference, 1e-3]);\n\n// ---- 발사 물리 (11단계) ----\n// 치올콥스키 검증: 중력을 끄고 1단 로켓을 태우면 Δv = Isp·g₀·ln(m₀/m_f) 와 같아야 한다 (docs/03_physics.md 6.4절)\nconst singleStage = {\n  payloadMassKg: 1_000,\n  stages: [{\n    id: 's1', label: '1단', role: 'serial', separationOrder: 1,\n    dryMassKg: 9_000, propellantMassKg: 90_000,\n    // 해수면 추력 = 진공 추력 으로 두어 고도 보간의 영향을 없앤다\n    engines: { count: 1, thrustSeaLevelN: 1_500_000, thrustVacuumN: 1_500_000, ispSeaLevelS: 300, ispVacuumS: 300 },\n    recovery: { enabled: false },\n  }],\n};\nconst noGravity = createLaunchSimulation(singleStage, { gravity: false, pitchProgram: () => 0, stepSeconds: 1 / 60 });\nwhile (!noGravity.isComplete()) noGravity.step(1);\nconst expectedDeltaV = 300 * STANDARD_GRAVITY * Math.log(100_000 / 10_000);\ncases.push(['치올콥스키 Δv (중력 없음, 1단)', expectedDeltaV, noGravity.getSpeed(), 2e-3]);\n\n// 팔콘 헤비 기본 피치 프로그램: 분리 시점이 실제 기록과 같은 자릿수이고, 2단 연소 종료 시 궤도 이상에 도달해야 한다 (6.7절)\nconst fh = createLaunchSimulation(FALCON_HEAVY, { stepSeconds: 1 / 20 });\nconst fhEvents = [];\nwhile (!fh.isComplete() && fh.getTime() < 1200) fhEvents.push(...fh.step(1));\nconst upperBurnoutAltitude = fh.getAltitude();\nconst upperBurnoutSpeed = fh.getSpeed();\n// 회수 단이 모두 접지할 때까지 계속 (13단계)\nwhile (!fh.isAllSettled() && fh.getTime() < 2400) fhEvents.push(...fh.step(1));\nconst boosterSep = fhEvents.find((e) => e.type === 'separation' && e.stageId === 'booster-left');\nconst coreSep = fhEvents.find((e) => e.type === 'separation' && e.stageId === 'core');\ncases.push(['팔콘 헤비 부스터 분리 시각 (s, 실제 약 150)', 150, boosterSep ? boosterSep.time : 0, 0.15]);\ncases.push(['팔콘 헤비 코어 분리 시각 (s, 실제 약 185)', 185, coreSep ? coreSep.time : 0, 0.15]);\ncases.push(['팔콘 헤비 2단 종료 고도 ≥ 200 km (km)', 200, Math.min(upperBurnoutAltitude / 1000, 200), 1e-6]);\n// 21단계(D-92): 연료를 다 태우는 대신 원궤도 속도에 닿으면 엔진을 끈다.\n// 그래서 \"7.8 km/s 이상\"이 아니라 \"그 고도의 원궤도 속도와 같은가\"로 확인한다.\ncases.push(['팔콘 헤비 2단 종료 속도 = 그 고도의 원궤도 속도 (km/s)',\n  circularOrbitSpeed(upperBurnoutAltitude) / 1000, upperBurnoutSpeed / 1000, 2e-3]);\ncases.push(['원궤도 속도: 지표에서 약 7.91 km/s', 7.905, circularOrbitSpeed(0) / 1000, 1e-3]);\ncases.push(['원궤도 속도: 고도 400 km에서 약 7.67 km/s', 7.669, circularOrbitSpeed(400_000) / 1000, 1e-3]);\ncases.push(['팔콘 헤비 추락 없음 (1 = 정상)', 1, fhEvents.some((e) => e.type === 'crash') ? 0 : 1, 1e-9]);\n\n// ---- 재착륙 (13단계): 부스터는 착륙장(2,000 m), 코어는 무인선에 3 m/s 이하로 내려앉아야 한다 (docs/03_physics.md 6.5절, D-41) ----\nconst boosterBody = fh.bodies.find((b) => b.stageId === 'booster-left');\nconst coreBody = fh.bodies.find((b) => b.stageId === 'core');\ncases.push(['부스터 착륙 성공 (1 = landed)', 1, boosterBody?.status === 'landed' ? 1 : 0, 1e-9]);\ncases.push(['부스터 접지 속도 ≤ 3 m/s (m/s)', 3, Math.max(boosterBody?.impactSpeed ?? 99, 3), 1e-6]);\ncases.push(['부스터 착륙 위치 = 착륙장 2,000 m (m, ±50)', 2000, boosterBody?.landedDownrange ?? 0, 0.025]);\ncases.push(['코어 착륙 성공 (1 = landed)', 1, coreBody?.status === 'landed' ? 1 : 0, 1e-9]);\ncases.push(['코어 접지 속도 ≤ 3 m/s (m/s)', 3, Math.max(coreBody?.impactSpeed ?? 99, 3), 1e-6]);\ncases.push(['코어 착륙 위치 = 무인선 위치 (m)', coreBody?.targetDownrange ?? 1, coreBody?.landedDownrange ?? 0, 1e-3]);\ncases.push(['모든 회수 단 접지 완료 (1 = 정상)', 1, fh.isAllSettled() ? 1 : 0, 1e-9]);\n\n// ---- 보조 화면 대상 고르기 (14단계, D-42): 가장 가까운(고도가 가장 낮은) 착륙 대상 ----\n// 가짜 물체로 규칙만 확인한다. r은 지구 중심 기준 위치이므로 고도 = |r| − R\nconst R = EARTH_RADIUS;\nconst fake = (id, alt, status, landedAt) => ({\n  id, label: id, r: { x: 0, y: R + alt }, v: { x: 0, y: 0 },\n  recovery: { enabled: true }, status, landedAt,\n});\nconst pickHigherLower = selectLandingTarget([\n  fake('high', 40_000, 'falling'),\n  fake('low', 5_000, 'falling'),\n]);\ncases.push(['보조 화면: 낙하 중 두 단 중 고도가 낮은 쪽 (m)', 5000, bodyAltitude(pickHigherLower) , 1e-6]);\n\nconst pickWhileOneLanded = selectLandingTarget([\n  fake('landed', 0, 'landed', 600),\n  fake('still', 30_000, 'falling'),\n]);\ncases.push(['보조 화면: 낙하 중인 단이 착륙한 단보다 우선 (1 = 그렇다)', 1, pickWhileOneLanded?.id === 'still' ? 1 : 0, 1e-9]);\n\nconst pickAllLanded = selectLandingTarget([\n  fake('first', 0, 'landed', 642),\n  fake('last', 0, 'landed', 721),\n]);\ncases.push(['보조 화면: 모두 착륙하면 마지막에 내려앉은 단 (접지 시각 s)', 721, pickAllLanded?.landedAt ?? 0, 1e-9]);\n\ncases.push(['보조 화면: 회수 단이 없으면 대상 없음 (1 = null)', 1, selectLandingTarget([]) === null ? 1 : 0, 1e-9]);\n\n// 실제 발사 결과에서는 코어가 마지막으로 내려앉으므로 끝까지 코어를 비춘다\nconst finalTarget = selectLandingTarget(fh.bodies);\ncases.push(['보조 화면: 발사 종료 시 대상 = 중앙 코어 (1 = 그렇다)', 1, finalTarget?.stageId === 'core' ? 1 : 0, 1e-9]);\n\n// ---- 항행 계산 (15단계): docs/03_physics.md 등속 모델 + 상대론적 도플러·광행차 ----\nconst jResult = { earthTime: 1000, shipTime: 400 };\n\nconst jHalf = journeyAt({ distance: 1e12, roundTrip: false, result: jResult, progress: 0.5 });\ncases.push(['항행: 편도 절반에서 지구와의 거리 (m)', 5e11, jHalf.fromEarth, 1e-9]);\ncases.push(['항행: 편도 절반에서 남은 거리 (m)', 5e11, jHalf.toTarget, 1e-9]);\ncases.push(['항행: 편도 절반에서 지구 시간 (s)', 500, jHalf.earthElapsed, 1e-9]);\ncases.push(['항행: 편도 절반에서 우주선 시간 (s)', 200, jHalf.shipElapsed, 1e-9]);\n\n// 왕복은 절반에서 목적지에 닿고, 그 뒤에는 지구로 되돌아온다\nconst jTurn = journeyAt({ distance: 1e12, roundTrip: true, result: jResult, progress: 0.5 });\ncases.push(['항행: 왕복 반환점에서 남은 거리 = 0 (m, 1 = 그렇다)', 1, Math.abs(jTurn.toTarget) < 1 ? 1 : 0, 1e-9]);\nconst jBack = journeyAt({ distance: 1e12, roundTrip: true, result: jResult, progress: 0.75 });\ncases.push(['항행: 왕복 3/4 지점에서 지구와의 거리 (m)', 5e11, jBack.fromEarth, 1e-9]);\ncases.push(['항행: 왕복 3/4 지점은 복귀 구간 (1 = 그렇다)', 1, jBack.outbound ? 0 : 1, 1e-9]);\n\n// 각반지름: 지구 반지름 6,371 km를 100,000 km 거리에서 보면 atan(6371/100000)\ncases.push(['각반지름 θ = atan(R/d) (rad)', Math.atan(6371 / 100000), angularRadius(6.371e6, 1e8), 1e-12]);\n\n// 상대론적 도플러: β = 0.6 → √(1.6/0.4) = 2\ncases.push(['도플러 인자 (β = 0.6, 정면)', 2, dopplerFactor(0.6, true), 1e-12]);\ncases.push(['도플러 인자 (β = 0.6, 후면) = 1/2', 0.5, dopplerFactor(0.6, false), 1e-12]);\n\n// 광행차: β = 0.6 에서 옆쪽(90°) 별은 앞쪽으로 당겨져 cos θ′ = +β → θ′ = acos(0.6) ≈ 53°\ncases.push(['광행차 θ = 90°, β = 0.6 (rad)', Math.acos(0.6), aberratedAngle(Math.PI / 2, 0.6), 1e-12]);\ncases.push(['광행차: 정면(0°)은 그대로 정면 (rad, 1 = 그렇다)', 1, aberratedAngle(0, 0.6) < 1e-9 ? 1 : 0, 1e-9]);\ncases.push(['광행차: 뒤쪽(180°)은 그대로 뒤쪽 (rad)', Math.PI, aberratedAngle(Math.PI, 0.6), 1e-9]);\ncases.push(['광행차: 항상 앞으로 몰린다 (θ′ < θ, 1 = 그렇다)', 1, aberratedAngle(2, 0.9) < 2 ? 1 : 0, 1e-9]);\n\ncases.push(['β = v/c (0.99c)', 0.99, beta(0.99 * c), 1e-12]);\n\n// ---- 천체 착륙 (17단계, D-61) ----\n// 달 표면 중력 1.62 m/s²에 4 * 31_557_600, gapInfo.perYear, 1e-9]);\n// 0.99c 프록시마 편도: 지구 4.29년, 우주선 0.605년 → 약 3.68년 차이\nconst proximaGap = ageGap(proxima, AGE_ORGANISMS);\ncases.push(['0.99c 프록시마 편도에서 덜 늙은 시간 (년)', 3.684,\n  proximaGap.gap / SECONDS_PER_YEAR, 2e-3]);\ncases.push(['덜 늙은 시간이 0이면 견줄 생물이 없다 (1 = 그렇다)', 1,\n  bestEquivalent(ageGap({ earthTime: 10, shipTime: 10 }, AGE_ORGANISMS)) === null ? 1 : 0, 1e-9]);\n\n// 표 출력\nconst tbody = document.getElementById('results');\nlet passed = 0;\nfor (const [name, expected, actual, tolerance] of cases) {\n  const relError = Math.abs(actual - expected) / Math.abs(expected);\n  const ok = relError <= tolerance;\n  if (ok) passed += 1;\n  const tr = document.createElement('tr');\n  tr.innerHTML = `<td>${name}</td><td>${fmt(expected)}</td><td>${fmt(actual)}</td><td>${tolerance}</td>`\n    + `<td class=\"${ok ? 'pass' : 'fail'}\">${ok ? '통과' : '실패'}</td>`;\n  tbody.appendChild(tr);\n}\nconst summary = document.getElementById('summary');\nsummary.textContent = `${passed} / ${cases.length} 통과`;\nsummary.className = passed === cases.length ? 'pass' : 'fail';\n\nfunction fmt(v) {\n  if (Math.abs(v) < 1e-3 || Math.abs(v) >= 1e9) return v.toExponential(4);\n  return v.toPrecision(6);\n}\n", "src/data/constants.js": "// 물리 상수 (프로젝트에서 유일한 정의 위치)\n// 출처: docs/05_data_reference.md 1절, docs/03_physics.md 1절과 6.1절\n// 단위는 모두 SI 기본 단위 (m, s, kg)\n\n// 진공 중 빛의 속도 (m/s). SI 정의값\nexport const SPEED_OF_LIGHT = 299_792_458;\n\n// 천문단위 (m). IAU 2012 결의 B2 정의값\nexport const ASTRONOMICAL_UNIT = 149_597_870_700;\n\n// 율리우스년 (s). 365.25일 × 86,400초. 시간 표시와 광년 정의에 사용\nexport const SECONDS_PER_YEAR = 365.25 * 86_400;\n\n// 광년 (m). 율리우스년 동안 빛이 가는 거리\nexport const LIGHT_YEAR = SPEED_OF_LIGHT * SECONDS_PER_YEAR;   // = 9,460,730,472,580,800 m\n\n// 표준 중력가속도 (m/s²). CGPM 1901. 가속 모델(8단계)과 발사 물리(11단계)에서 사용\nexport const STANDARD_GRAVITY = 9.80665;\n\n// 지구 표준 중력 매개변수 GM (m³/s²). WGS 84. 발사 물리에서 사용\nexport const EARTH_GM = 3.986004418e14;\n\n// 지구 평균 반지름 (m). 발사 물리에서 사용\nexport const EARTH_RADIUS = 6_371_000;\n", "src/physics/exploration.js": "// 우주인 지표 탐사 (20단계, D-77)\n// 역할: 착륙 뒤 우주인이 수행할 임무 목록과, 걷기·점프의 물리를 계산한다.\n// 화면도 Three.js도 모르는 순수 함수. 검증은 tests/physics.test.js.\n//\n// 걷기: 천체 중력이 약할수록 한 걸음이 멀리 가고 점프가 높다.\n//   같은 힘으로 뛰어오를 때 도달 높이 h = v₀² / (2g) 이므로, 달(1.62)에서는 지구(9.81)의 약 6배 높이가 된다.\n// 임무 판정: 우주인이 목표 지점 반경 안에 들어와 있으면 수행할 수 있다.\n\n/** 임무 목표 지점 (착륙선 기준 상대 위치, m) */\nexport const EXPLORATION_TASKS = [\n  { id: 'flag', label: '깃발 꽂기', key: 'E', at: { x: 22, z: -14 }, radius: 6,\n    hint: '착륙선 옆 평지에 깃발을 세운다' },\n  { id: 'sample-a', label: '표본 채집 ①', key: 'E', at: { x: -34, z: 26 }, radius: 6,\n    hint: '밝은 돌무더기에서 겉흙을 담는다' },\n  { id: 'sample-b', label: '표본 채집 ②', key: 'E', at: { x: 48, z: 40 }, radius: 6,\n    hint: '크레이터 가장자리에서 암석을 집는다' },\n  { id: 'photo', label: '기념 촬영', key: 'E', at: { x: -18, z: -38 }, radius: 7,\n    hint: '착륙선이 잘 보이는 자리에서 사진을 찍는다' },\n  { id: 'return', label: '착륙선 복귀', key: 'E', at: { x: 0, z: 0 }, radius: 8,\n    hint: '모든 임무를 마치고 사다리로 돌아간다', last: true },\n];\n\n/** 지구 표준 중력 (비교 기준) */\nconst G_EARTH = 9.81;\n/** 지구에서의 걷는 속도 (m/s)와 점프 초속도 (m/s) */\nconst WALK_SPEED_EARTH = 2.2;\nconst JUMP_SPEED = 2.6;\n\n/**\n * 천체 중력에 맞춘 걷기·점프 값.\n * 걷는 속도는 중력이 약할수록 조금 빨라진다(√ 비례). 점프 높이는 1/g 에 비례한다.\n * @param {number} gravity  m/s²\n * @returns {{ walkSpeed: number, jumpSpeed: number, jumpHeight: number, fallTime: number }}\n */\nexport function walkParameters(gravity) {\n  const g = Math.max(gravity, 0.05);\n  const walkSpeed = WALK_SPEED_EARTH * Math.sqrt(G_EARTH / g) ** 0.5;   // 달에서 약 1.4배\n  const jumpHeight = (JUMP_SPEED * JUMP_SPEED) / (2 * g);\n  const fallTime = (2 * JUMP_SPEED) / g;\n  return { walkSpeed, jumpSpeed: JUMP_SPEED, jumpHeight, fallTime };\n}\n\n/**\n * 우주인이 지금 수행할 수 있는 임무 (반경 안에 들어와 있고 아직 안 한 것).\n * 마지막 임무(복귀)는 나머지를 모두 끝내야 할 수 있다.\n * @param {{ x: number, z: number }} position\n * @param {Record<string, boolean>} done\n */\nexport function taskInReach(position, done = {}) {\n  const others = EXPLORATION_TASKS.filter((t) => !t.last);\n  const allOthersDone = others.every((t) => done[t.id]);\n  return EXPLORATION_TASKS.find((t) => {\n    if (done[t.id]) return false;\n    if (t.last && !allOthersDone) return false;\n    const dx = position.x - t.at.x;\n    const dz = position.z - t.at.z;\n    return Math.hypot(dx, dz) <= t.radius;\n  }) ?? null;\n}\n\n/**\n * 가장 가까운 남은 임무와 거리 (안내 화살표용).\n * @param {{ x: number, z: number }} position\n * @param {Record<string, boolean>} done\n * @returns {{ task: object, distance: number } | null}\n */\nexport function nearestTask(position, done = {}) {\n  const others = EXPLORATION_TASKS.filter((t) => !t.last);\n  const allOthersDone = others.every((t) => done[t.id]);\n  let best = null;\n  for (const t of EXPLORATION_TASKS) {\n    if (done[t.id]) continue;\n    if (t.last && !allOthersDone) continue;\n    const distance = Math.hypot(position.x - t.at.x, position.z - t.at.z);\n    if (!best || distance < best.distance) best = { task: t, distance };\n  }\n  return best;\n}\n\n/**\n * 탐사 완료 여부와 점수.\n * @param {Record<string, boolean>} done\n * @returns {{ complete: boolean, doneCount: number, total: number, score: number }}\n */\nexport function explorationScore(done = {}) {\n  const total = EXPLORATION_TASKS.length;\n  const doneCount = EXPLORATION_TASKS.filter((t) => done[t.id]).length;\n  return {\n    complete: doneCount === total,\n    doneCount,\n    total,\n    score: Math.round((doneCount / total) * 100),\n  };\n}\n", "src/physics/landingMission.js": "// 착륙 절차 (18단계, D-67) — KSP처럼 사용자가 직접 수행하는 체크리스트\n// 역할: 착륙 중 해야 할 절차의 순서와 조건, 수행 여부에 따른 등급을 계산한다.\n// 화면도 Three.js도 모르는 순수 함수. 검증은 tests/physics.test.js.\n//\n// D-41(착륙은 항상 성공)은 그대로 둔다. 절차를 놓쳐도 부서지지 않고, 등급만 낮아진다.\n\n/**\n * 절차 목록. `readyAbove`~`readyBelow` 고도 구간에서 수행할 수 있다 (m).\n * required: 놓치면 감점되는 항목\n */\nexport const SURFACE_STEPS = [\n  { id: 'burn', label: '감속 연소 시작', key: 'Z', readyBelow: 2_000, readyAbove: 600,\n    hint: '고도 2,000 m 아래에서 엔진을 켜 낙하를 늦춘다', required: true },\n  { id: 'legs', label: '착륙 다리 펴기', key: 'X', readyBelow: 900, readyAbove: 60,\n    hint: '고도 900 m 아래에서 다리를 편다', required: true },\n  { id: 'final', label: '최종 접근 자세', key: 'C', readyBelow: 200, readyAbove: 15,\n    hint: '고도 200 m 아래에서 수직 자세를 잡는다', required: true },\n  { id: 'shutdown', label: '엔진 정지', key: 'V', readyBelow: 12, readyAbove: 0,\n    hint: '접지 직전에 엔진을 끈다', required: false },\n];\n\n// 지구 재진입용 절차 (D-66). 고도 80 km에서 시작하므로 기준 고도가 훨씬 높다.\nexport const REENTRY_STEPS = [\n  { id: 'heatshield', label: '열 차폐 자세', key: 'Z', readyBelow: 80_000, readyAbove: 45_000,\n    hint: '고도 80 km, 대기와 부딪히기 전에 바닥을 아래로 돌린다', required: true },\n  { id: 'burn', label: '감속 연소 시작', key: 'X', readyBelow: 30_000, readyAbove: 8_000,\n    hint: '고도 30 km 아래에서 엔진을 켜 낙하를 늦춘다', required: true },\n  { id: 'legs', label: '착륙 다리 펴기', key: 'C', readyBelow: 4_000, readyAbove: 300,\n    hint: '고도 4 km 아래에서 다리를 편다', required: true },\n  { id: 'final', label: '최종 접근 자세', key: 'V', readyBelow: 600, readyAbove: 20,\n    hint: '고도 600 m 아래에서 수직 자세를 잡는다', required: true },\n];\n\n/** 예전 이름 (달·화성 착륙 절차) */\nexport const LANDING_STEPS = SURFACE_STEPS;\n\n/**\n * 천체에 맞는 절차 목록. 지구는 대기가 있어 재진입 절차를 쓴다.\n * @param {object} visual  data/celestialBodies.js 항목\n */\nexport function stepsFor(visual) {\n  return visual?.reentry ? REENTRY_STEPS : SURFACE_STEPS;\n}\n\n/**\n * 지금 고도에서 수행할 수 있는(그리고 아직 안 한) 절차.\n * @param {number} altitude  m\n * @param {Record<string, boolean>} done  절차 id → 수행 여부\n * @returns {object | null}\n */\nexport function activeStep(altitude, done = {}, steps = SURFACE_STEPS) {\n  return steps.find((s) => !done[s.id] && altitude <= s.readyBelow) ?? null;\n}\n\n/**\n * 놓친 절차 (수행 가능 구간을 이미 지나갔는데 안 한 것).\n * @param {number} altitude\n * @param {Record<string, boolean>} done\n */\nexport function missedSteps(altitude, done = {}, steps = SURFACE_STEPS) {\n  return steps.filter((s) => !done[s.id] && altitude < s.readyAbove);\n}\n\n/**\n * 절차 수행이 하강에 주는 영향.\n * 감속 연소를 안 켜면 더 빨리 떨어지고, 다리를 안 펴면 접지 속도가 그대로 충격이 된다.\n * @param {Record<string, boolean>} done\n * @returns {{ descentScale: number, legsOut: boolean }}\n *   descentScale: 하강 속도에 곱할 값 (1보다 크면 더 빠르게 떨어진다)\n */\nexport function descentPenalty(done = {}) {\n  return {\n    descentScale: done.burn ? 1 : 1.8,\n    legsOut: Boolean(done.legs),\n  };\n}\n\n/**\n * 착륙 등급 (D-67). 절차 수행률과 접지 속도로 A~D를 매긴다.\n * @param {Record<string, boolean>} done\n * @param {number} touchdownSpeed  접지 속도 (m/s)\n * @returns {{ grade: string, score: number, notes: string[] }}\n *   score: 0~100\n */\nexport function landingGrade(done = {}, touchdownSpeed = 1.5, steps = SURFACE_STEPS) {\n  const notes = [];\n  const required = steps.filter((s) => s.required);\n  const doneCount = required.filter((s) => done[s.id]).length;\n  // 절차 60점 + 접지 속도 40점\n  const stepScore = (doneCount / required.length) * 60;\n  // 1.5 m/s 이하면 만점, 12 m/s 이상이면 0점\n  const speedScore = Math.max(0, Math.min(1, (12 - touchdownSpeed) / (12 - 1.5))) * 40;\n  const score = Math.round(stepScore + speedScore);\n\n  for (const s of required) if (!done[s.id]) notes.push(`${s.label} 안 함`);\n  if (touchdownSpeed > 3) notes.push(`접지 속도 ${touchdownSpeed.toFixed(1)} m/s (권장 3 이하)`);\n  if (done.shutdown) notes.push('엔진 정지 수행 (+)');\n\n  const grade = score >= 90 ? 'A' : score >= 75 ? 'B' : score >= 55 ? 'C' : 'D';\n  return { grade, score, notes };\n}\n\n/**\n * 조준 보너스 (D-68). 목적지가 조준선 안에 머문 비율로 점수를 준다.\n * @param {number} onTargetSeconds  조준선 안에 있던 시간\n * @param {number} totalSeconds     전체 시간\n * @returns {{ ratio: number, bonus: number }}  bonus: 0~20점\n */\nexport function aimBonus(onTargetSeconds, totalSeconds) {\n  if (totalSeconds <= 0) return { ratio: 0, bonus: 0 };\n  const ratio = Math.min(Math.max(onTargetSeconds / totalSeconds, 0), 1);\n  return { ratio, bonus: Math.round(ratio * 20) };\n}\n\n// ---- 착륙 성공·실패 판정 (20단계, D-75 · D-76) ----\n// 사용자 요청으로 실패를 도입한다. D-41(항상 성공)은 목적지·지구 착륙에서는 더 이상 적용하지 않는다.\n// 부스터·코어 회수(13단계, physics/landingGuidance.js)는 자동 유도이므로 그대로 항상 성공한다.\n\n/** 착륙 다리가 견디는 접지 속도 한계 (m/s). 실제 착륙선은 3 m/s 안팎으로 설계한다 */\nexport const TOUCHDOWN_LIMIT = 6;\n\n/**\n * 접지 결과.\n * @param {number} speed     접지 속도 (m/s)\n * @param {boolean} legsOut  착륙 다리를 폈는가\n * @returns {{ crashed: boolean, reason: string }}\n */\nexport function judgeTouchdown(speed, legsOut) {\n  if (!legsOut) return { crashed: true, reason: '착륙 다리를 펴지 않아 동체가 지면에 부딪혔습니다' };\n  if (speed > TOUCHDOWN_LIMIT) {\n    return { crashed: true, reason: `접지 속도 ${speed.toFixed(1)} m/s — 한계 ${TOUCHDOWN_LIMIT} m/s를 넘어 다리가 부러졌습니다` };\n  }\n  return { crashed: false, reason: '' };\n}\n", "src/physics/ascentMission.js": "// 상승 절차 (19단계, D-73) — 발사부터 궤도 진입까지를 사용자가 짚어 가며 진행한다\n// 역할: 상승 중의 이정표(이륙 · 피치 기동 · Max-Q · 부스터 분리 · 코어 분리 · 페어링 분리 · 궤도 진입)를\n//       정의하고, 지금 시뮬레이션 상태에서 어디까지 왔는지 판정한다.\n// 화면도 Three.js도 모르는 순수 함수. 검증은 tests/physics.test.js.\n//\n// 왜 필요한가: 팔콘 헤비의 상승은 8분 30초라 가만히 보고만 있으면 지루하다.\n//   이정표를 눌러 그 지점까지 건너뛸 수 있게 하면, 보고 싶은 장면만 골라 볼 수 있고\n//   무엇이 언제 일어나는지도 함께 배운다.\n\n/**\n * 각 이정표는 `reached(sim)`으로 도달 여부를 판정한다.\n * kind: 'auto'  물리가 알아서 일으키는 사건 (분리 등) — 눌러서 그 시점까지 건너뛴다\n *       'note'  연출·설명용 지점 — 역시 건너뛰기로 이동한다\n * nominalSeconds: 팔콘 헤비 기본 제원으로 시뮬레이션을 돌려 얻은 예상 도달 시각(초, 발사부터).\n *   판정에는 쓰지 않는다. 진행 막대가 이정표 사이에서도 부드럽게 차오르게 하는 데만 쓴다(ascentProgress).\n */\nexport const ASCENT_STEPS = [\n  {\n    id: 'liftoff', label: '이륙', key: '1', kind: 'auto', nominalSeconds: 0.5,\n    hint: '엔진 점화, 발사대를 떠난다',\n    reached: (sim) => sim.getTime() > 0.5,\n  },\n  {\n    id: 'pitch', label: '피치 기동', key: '2', kind: 'note', nominalSeconds: 29,\n    hint: '고도 2 km — 수직에서 진행 방향으로 서서히 눕기 시작한다',\n    reached: (sim) => sim.getAltitude() >= 2_000,\n  },\n  {\n    id: 'maxq', label: 'Max-Q 통과', key: '3', kind: 'note', nominalSeconds: 63,\n    hint: '고도 12 km — 공기 저항이 가장 센 지점을 지난다',\n    reached: (sim) => sim.getAltitude() >= 12_000,\n  },\n  {\n    id: 'boosters', label: '측면 부스터 분리', key: '4', kind: 'auto', nominalSeconds: 145,\n    hint: '양옆 부스터 2기가 떨어져 나가 착륙장으로 돌아간다',\n    reached: (sim) => sim.bodies.some((b) => b.stageId?.startsWith('booster')),\n  },\n  {\n    id: 'core', label: '중앙 코어 분리', key: '5', kind: 'auto', nominalSeconds: 203,\n    hint: '코어가 분리되어 바다 위 무인선으로 향한다',\n    reached: (sim) => sim.bodies.some((b) => b.stageId === 'core'),\n  },\n  {\n    id: 'fairing', label: '페어링 분리', key: '6', kind: 'note', nominalSeconds: 215,\n    hint: '고도 120 km — 공기가 거의 없어 탑재체 덮개를 버린다',\n    reached: (sim) => sim.getAltitude() >= 120_000,\n  },\n  {\n    id: 'orbit', label: '궤도 진입 · 우주선 출발', key: '7', kind: 'auto', nominalSeconds: 493,\n    hint: '2단 연소가 끝나고 우주선이 목적지로 떠난다',\n    reached: (sim) => sim.isComplete(),\n  },\n];\n\n/**\n * 지금까지 도달한 이정표들.\n * @param {object} sim  physics/launchDynamics.js의 시뮬레이션\n * @returns {Record<string, boolean>}\n */\nexport function reachedSteps(sim) {\n  const done = {};\n  for (const step of ASCENT_STEPS) done[step.id] = Boolean(sim && step.reached(sim));\n  return done;\n}\n\n/**\n * 다음에 올 이정표 (아직 도달하지 않은 것 중 첫 번째).\n * @param {object} sim\n * @returns {object | null}\n */\nexport function nextStep(sim) {\n  return ASCENT_STEPS.find((s) => !s.reached(sim)) ?? null;\n}\n\n/**\n * 상승 진행률 0~1 (19단계 → 21단계에서 연속 진행으로 수정).\n *\n * 왜 바꿨나: 도달한 이정표 수만 세면 막대가 0 → 14% → 29%처럼 한 칸씩 튄다.\n *   그 사이에도 로켓은 계속 올라가고 있으므로 막대도 계속 차올라야 한다.\n *\n * 방법: 이정표마다 예상 도달 시각(`nominalSeconds`)이 있으므로,\n *   지금 시각이 어느 두 이정표 사이인지 보고 그 안에서 비례 배분한다.\n *   즉 발사 시각표를 따라 흐르는 시계 눈금과 같다. 이정표를 눌러 건너뛰면 시뮬레이션 시각도\n *   함께 뛰므로 막대도 그만큼 앞으로 간다.\n *   실제 종료는 시뮬레이션이 정한다(`isComplete`). 그전까지는 99%를 넘지 않게 막아,\n *   아직 궤도에 못 올랐는데 100%로 보이는 일이 없게 한다.\n *\n * @param {object} sim\n * @returns {number} 0~1\n */\nexport function ascentProgress(sim) {\n  if (!sim) return 0;\n  if (sim.isComplete()) return 1;\n  const n = ASCENT_STEPS.length;\n  const t = sim.getTime();\n\n  let value = 1;\n  for (let i = 0; i < n; i += 1) {\n    const prev = i === 0 ? 0 : ASCENT_STEPS[i - 1].nominalSeconds;\n    const cur = ASCENT_STEPS[i].nominalSeconds;\n    if (t >= cur) continue;\n    value = (i + (t - prev) / Math.max(cur - prev, 0.001)) / n;\n    break;\n  }\n  return Math.min(Math.max(value, 0), 0.99);\n}\n", "src/data/destinations.js": "// 목적지 천체 12개의 기초 데이터 (2단계)\n// 값과 출처: docs/05_data_reference.md 3절\n// 거리는 지구로부터의 평균 거리이며, 사용자 결정(D-09)에 따라 하나의 값으로 고정한다.\n// 저장 단위는 m. 원 자료의 단위(km, AU, 광년)를 그대로 적고 변환 함수로 m를 만든다.\n\n// 규칙(src/data/README.md): 이 폴더는 다른 폴더를 불러오지 않는다. 변환은 같은 폴더의 상수로만 한다.\nimport { ASTRONOMICAL_UNIT, LIGHT_YEAR } from \"__MOD__src/data/constants.js__END__\";\n\nconst kmToMeters = (km) => km * 1000;\nconst auToMeters = (au) => au * ASTRONOMICAL_UNIT;\nconst lightYearsToMeters = (ly) => ly * LIGHT_YEAR;\n\n// 구분(category) 표시 이름과 순서\nexport const DESTINATION_CATEGORIES = [\n  { id: 'solar', label: '태양계' },\n  { id: 'nearby', label: '근처 별' },\n  { id: 'galaxy', label: '은하 규모' },\n  { id: 'extragalactic', label: '은하 밖' },\n];\n\nexport const DESTINATIONS = [\n  // ---- 태양계 ----\n  { id: 'moon',    category: 'solar', name: '달',     distance: kmToMeters(384_400),\n    source: 'NASA 팩트시트, 평균 지심 거리' },\n  { id: 'mars',    category: 'solar', name: '화성',   distance: kmToMeters(225_000_000),\n    source: 'NASA, 지구-화성 평균 거리 (개략값)' },\n  { id: 'jupiter', category: 'solar', name: '목성',   distance: auToMeters(5.20),\n    source: '태양-목성 평균 거리 5.20 AU를 지구 기준 평균으로 근사' },\n  { id: 'saturn',  category: 'solar', name: '토성',   distance: auToMeters(9.54),\n    source: '태양-토성 평균 거리 9.54 AU를 지구 기준 평균으로 근사' },\n  { id: 'neptune', category: 'solar', name: '해왕성', distance: auToMeters(30.07),\n    source: '태양-해왕성 평균 거리 30.07 AU를 지구 기준 평균으로 근사' },\n  { id: 'sun',     category: 'solar', name: '태양',   distance: auToMeters(1),\n    source: 'IAU 정의값 1 AU' },\n\n  // ---- 근처 별 ----\n  { id: 'proxima', category: 'nearby', name: '프록시마 센타우리', distance: lightYearsToMeters(4.246),\n    source: 'Gaia 시차 기준' },\n  { id: 'sirius',  category: 'nearby', name: '시리우스',         distance: lightYearsToMeters(8.60),\n    source: 'Hipparcos 시차 기준' },\n  { id: 'vega',    category: 'nearby', name: '베가',             distance: lightYearsToMeters(25.04),\n    source: 'Hipparcos 시차 기준' },\n\n  // ---- 은하 규모 ----\n  { id: 'orion',           category: 'galaxy', name: '오리온 성운 (M42)',        distance: lightYearsToMeters(1_344),\n    source: 'Menten 외 2007, 전파 시차' },\n  { id: 'galactic-center', category: 'galaxy', name: '은하 중심 (궁수자리 A*)', distance: lightYearsToMeters(26_000),\n    source: 'GRAVITY 협력단 2019 (8.18 kpc)' },\n\n  // ---- 은하 밖 ----\n  { id: 'andromeda', category: 'extragalactic', name: '안드로메다 은하 (M31)', distance: lightYearsToMeters(2_537_000),\n    source: '세페이드 변광성 거리 측정' },\n];\n\n// 기본 선택값: 달\nexport const DEFAULT_DESTINATION_ID = 'moon';\n\n// id로 천체를 찾는다. 없으면 undefined\nexport function findDestination(id) {\n  return DESTINATIONS.find((d) => d.id === id);\n}\n", "src/physics/missionTimeline.js": "// 임무 구간(챕터) 계산 (18단계, D-65)\n// 역할: 임무 전체를 사람이 이해하는 구간으로 나누고, 각 구간이 진행 바의 어디부터 어디까지인지 알려준다.\n// 화면도 Three.js도 모르는 순수 함수. 검증은 tests/physics.test.js.\n//\n// 진행 바는 \"항행 진행률 0~1\" 하나를 쓴다. 발사·착륙처럼 항행 시계가 멈추는 구간은\n// 진행률 위의 한 점(0 또는 반환점 또는 1)에 붙어 있고, 칩을 누르면 그 장면을 처음부터 재생한다.\n\n/**\n * 임무 구간 목록을 만든다.\n * @param {{ roundTrip: boolean, landable: boolean, targetName: string }} options\n * @returns {Array<{ id, label, phase, at, enabled, hint }>}\n *   at: 그 구간이 시작될 때의 항행 진행률 (0~1)\n *   phase: 그 구간에서 들어가야 하는 임무 단계\n */\nexport function missionChapters({ roundTrip = false, landable = false, targetName = '목적지' } = {}) {\n  const turn = roundTrip ? 0.5 : 1;\n  const chapters = [\n    { id: 'launch', label: '발사', phase: 'launch', at: 0, enabled: true,\n      hint: '이륙 → 부스터 분리 → 코어 분리' },\n    { id: 'orbit', label: '궤도 진입', phase: 'cruise', at: 0, enabled: true,\n      hint: '2단 연소가 끝나고 우주선이 출발한다' },\n    { id: 'outbound', label: '항행', phase: 'cruise', at: 0.02, enabled: true,\n      hint: `${targetName}까지 가는 길` },\n    { id: 'target', label: landable ? `${targetName} 착륙` : `${targetName} 근접`, phase: landable ? 'landing' : 'cruise',\n      at: turn, enabled: true,\n      hint: landable ? '지표에 내려앉는다' : '표면이 없어 곁을 스쳐 지나간다' },\n    { id: 'return', label: '귀환', phase: 'cruise', at: roundTrip ? 0.52 : 1, enabled: roundTrip,\n      hint: '지구로 돌아오는 길' },\n    { id: 'reentry', label: '지구 재착륙', phase: 'reentry', at: 1, enabled: roundTrip,\n      hint: '대기권에 다시 들어와 착륙한다' },\n  ];\n  return chapters;\n}\n\n/**\n * 지금 상태가 어느 구간인지 알려준다.\n * @param {Array} chapters  missionChapters 결과\n * @param {{ phase: string, progress: number, visitedTarget: boolean }} state\n * @returns {string} 구간 id\n */\nexport function currentChapter(chapters, { phase, progress, visitedTarget }) {\n  if (phase === 'ready' || phase === 'launch') return 'launch';\n  if (phase === 'landing') return 'target';\n  if (phase === 'reentry') return 'reentry';\n  const roundTrip = chapters.find((c) => c.id === 'return')?.enabled;\n  if (phase === 'arrived') return roundTrip ? 'reentry' : 'target';\n  // 항행 중\n  if (progress <= 0.02) return 'orbit';\n  if (roundTrip && visitedTarget) return 'return';\n  const turn = roundTrip ? 0.5 : 1;\n  if (progress >= turn) return 'target';\n  return 'outbound';\n}\n", "src/physics/journey.js": "// 항행(우주 여행) 계산 (15단계)\n// 역할: \"임무 진행률 p (0~1)\"를 받아 그 순간의 이동 거리·경과 시간과, 3D 장면이 쓸 겉보기 크기를 계산한다.\n// 화면(DOM)도 Three.js도 모르는 순수 함수. 검증은 tests/physics.test.js.\n//\n// 공식 근거: docs/03_physics.md\n//   - 등속 모델이므로 이동 거리와 경과 시간은 진행률에 비례한다 (왕복은 절반에서 되돌아온다).\n//   - 겉보기 반지름(각반지름) θ = atan(R / d). 멀리 있으면 작게, 가까우면 크게 보인다.\n//   - 상대론적 도플러 (정면): f_관측 / f_원천 = √((1+β)/(1−β)). 앞쪽 별이 파랗게, 뒤쪽 별이 붉게 보인다.\n//   - 광행차: cos θ′ = (cos θ + β) / (1 + β·cos θ). 빠를수록 별이 진행 방향 앞쪽으로 몰린다(전조등 효과).\n// 단위: m, s, 무차원(β = v/c)\n\nimport { SPEED_OF_LIGHT } from \"__MOD__src/data/constants.js__END__\";\n\nconst clamp01 = (x) => Math.min(Math.max(x, 0), 1);\n\n// 임무 재생 길이 (ms). 결과가 길수록 오래 재생한다 (D-31 비고).\n// 1초(log10 = 0) → 3초, 10¹⁹초 → 15초. 6단계 스톱워치와 같은 규칙을 쓴다.\nconst MIN_DURATION_MS = 3_000;\nconst MAX_DURATION_MS = 15_000;\nconst LOG_MIN = 0;\nconst LOG_MAX = 19;\n\n/**\n * 결과 시간(초)에 따라 재생 길이(ms)를 정한다. (15단계 규칙, 18단계부터는 아래 거리 기준을 쓴다)\n * @param {number} totalSeconds  지구에서 흐른 시간\n */\nexport function animationDurationMs(totalSeconds) {\n  const log = Math.log10(Math.max(totalSeconds, 1));\n  const t = clamp01((log - LOG_MIN) / (LOG_MAX - LOG_MIN));\n  return MIN_DURATION_MS + t * (MAX_DURATION_MS - MIN_DURATION_MS);\n}\n\n// ---- 18단계 (D-63): 항행 재생 시간은 \"거리\"로 정한다 ----\n// 지구 시간으로 정하면 같은 목적지도 속도에 따라 재생 시간이 달라져 거리 비교가 안 된다.\n// 거리의 로그에 비례해 달 5초 ~ 안드로메다 60초 사이로 늘린다. 목적지마다 값이 고정된다.\nexport const TRAVEL_MIN_SECONDS = 5;\nexport const TRAVEL_MAX_SECONDS = 60;\nconst NEAREST_DISTANCE_M = 3.844e8;      // 달까지의 평균 거리\nconst FARTHEST_DISTANCE_M = 2.4e22;      // 안드로메다 은하까지의 거리\n\n/**\n * 목적지까지의 재생 시간 (초).\n * @param {number} distanceM  편도 거리 (m)\n * @param {boolean} roundTrip  왕복이면 2배\n */\nexport function travelDurationSeconds(distanceM, roundTrip = false) {\n  const d = Math.max(distanceM, 1);\n  const lo = Math.log10(NEAREST_DISTANCE_M);\n  const hi = Math.log10(FARTHEST_DISTANCE_M);\n  const t = clamp01((Math.log10(d) - lo) / (hi - lo));\n  const seconds = TRAVEL_MIN_SECONDS + t * (TRAVEL_MAX_SECONDS - TRAVEL_MIN_SECONDS);\n  return roundTrip ? seconds * 2 : seconds;\n}\n\n/**\n * 진행률 p에서의 항행 상태.\n * @param {object} args\n * @param {number} args.distance    편도 거리 (m)\n * @param {boolean} args.roundTrip  왕복이면 true\n * @param {{ earthTime: number, shipTime: number }} args.result  전체 여행의 경과 시간 (s)\n * @param {number} args.progress    0 ~ 1\n * @returns {{\n *   progress: number,\n *   outbound: boolean,      갈 때면 true, 돌아올 때면 false\n *   fromEarth: number,      지금 지구에서 떨어진 거리 (m)\n *   toTarget: number,       지금 목적지까지 남은 거리 (m). 왕복 복귀 구간에서는 멀어진다\n *   travelled: number,      실제로 지나온 총 거리 (m)\n *   earthElapsed: number,   지구에서 흐른 시간 (s)\n *   shipElapsed: number,    우주선에서 흐른 시간 (s)\n * }}\n */\nexport function journeyAt({ distance, roundTrip = false, result, progress }) {\n  const p = clamp01(progress);\n  const total = roundTrip ? distance * 2 : distance;\n  const travelled = total * p;\n  const outbound = !roundTrip || p <= 0.5;\n  // 왕복 복귀 구간에서는 지구까지의 거리가 다시 줄어든다\n  const fromEarth = outbound ? travelled : total - travelled;\n  const toTarget = outbound ? distance - fromEarth : distance - (total - travelled);\n  return {\n    progress: p,\n    outbound,\n    fromEarth,\n    toTarget: Math.abs(toTarget),\n    travelled,\n    earthElapsed: result.earthTime * p,\n    shipElapsed: result.shipTime * p,\n  };\n}\n\n/**\n * 각반지름 (rad). 반지름 R인 천체가 거리 d에서 얼마나 크게 보이는가.\n * @param {number} radiusM\n * @param {number} distanceM\n */\nexport function angularRadius(radiusM, distanceM) {\n  if (distanceM <= radiusM) return Math.PI / 2;   // 표면에 닿음\n  return Math.atan(radiusM / distanceM);\n}\n\n/**\n * 상대론적 도플러 인자 (정면으로 다가갈 때). 1보다 크면 파란쪽, 작으면 붉은쪽.\n * @param {number} beta   v / c, 0 이상 1 미만\n * @param {boolean} approaching  다가가는 쪽이면 true (뒤쪽 별이면 false)\n */\nexport function dopplerFactor(beta, approaching = true) {\n  const b = Math.min(Math.max(beta, 0), 0.999999);\n  const factor = Math.sqrt((1 + b) / (1 - b));\n  return approaching ? factor : 1 / factor;\n}\n\n/**\n * 상대론적 광행차. 정지 좌표계에서 진행 방향과 이루는 각 θ에 있는 별이, 달리는 우주선에서는 θ′에 보인다.\n * cos θ′ = (cos θ + β) / (1 + β·cos θ)\n * β가 커질수록 θ′가 작아진다. 즉 온 하늘의 별이 진행 방향 앞쪽으로 몰려 보인다 (전조등 효과).\n * @param {number} theta  rad, 0 = 진행 방향 정면\n * @param {number} beta\n * @returns {number} θ′ (rad)\n */\nexport function aberratedAngle(theta, beta) {\n  const b = Math.min(Math.max(beta, 0), 0.999999);\n  const c = Math.cos(theta);\n  return Math.acos(Math.min(Math.max((c + b) / (1 + b * c), -1), 1));\n}\n\n/**\n * 속도를 β로. 화면 쪽에서 자주 쓰므로 여기에 둔다.\n * @param {number} speed  m/s\n */\nexport function beta(speed) {\n  return Math.min(Math.max(speed / SPEED_OF_LIGHT, 0), 0.999999);\n}\n", "src/data/celestialBodies.js": "// 목적지 천체의 3D 표시용 데이터 (15단계)\n// 값과 출처: docs/05_data_reference.md 3절과 아래 주석. 거리는 destinations.js가 갖고, 여기는 \"생김새\"만 둔다.\n// 규칙(src/data/README.md): 이 폴더는 다른 폴더를 불러오지 않는다.\n//\n// radiusM: 실제 반지름 (m). 화면에서는 항행 장면이 로그 축척으로 줄여 그린다.\n//   성운·은하는 반지름이 광년 단위라 그대로 쓰면 화면을 덮어 버리므로, 표시용 반지름을 따로 둔다(displayRadiusM).\n// kind: 'planet' | 'star' | 'moon' | 'nebula' | 'galaxy'  — 그리는 방법이 달라진다\n// color: 대략적인 실제 색. 사진이 아닌 단색 구/원반으로 그린다 (외부 이미지 금지, 파일 동봉 원칙)\n\nconst KM = 1000;\nconst LY = 9.4607304725808e15;   // constants.js와 같은 값. data 폴더 안에서만 쓰는 지역 상수\n\nexport const CELESTIAL_BODIES = {\n  // ---- 출발지 ----\n  earth: {\n    name: '지구', kind: 'planet', radiusM: 6_371 * KM,\n    color: 0x2f6f43, atmosphere: 0x4a8fe0, glow: 0,\n    // 21단계(D-88): 항행 화면에서 지구만은 실사 텍스처(NASA 블루마블)를 입힌다\n    surface: 'earth',\n    // 18단계(D-66): 왕복의 마지막에 지구로 돌아와 내려앉는다\n    landable: true, surfaceGravity: 9.81, reentry: true,\n    landingStartAltitudeM: 80_000,   // 재진입 시작 고도 (카르만 선 위)\n    source: 'IAU 평균 반지름 6,371 km / 표준 중력 9.81 m/s²',\n  },\n\n  // ---- 태양계 ----\n  moon: {\n    name: '달', kind: 'moon', radiusM: 1_737.4 * KM,\n    color: 0xb9b6ad, glow: 0,\n    landable: true, surfaceGravity: 1.62,   // NASA 팩트시트\n    source: 'NASA 팩트시트, 평균 반지름 1,737.4 km / 표면 중력 1.62 m/s²',\n  },\n  mars: {\n    name: '화성', kind: 'planet', radiusM: 3_389.5 * KM,\n    color: 0xc1552e, atmosphere: 0xd9a07a, glow: 0,\n    landable: true, surfaceGravity: 3.72,   // NASA 팩트시트\n    source: 'NASA 팩트시트, 평균 반지름 3,389.5 km / 표면 중력 3.72 m/s²',\n  },\n  jupiter: {\n    name: '목성', kind: 'planet', radiusM: 69_911 * KM,\n    color: 0xd8b48c, atmosphere: 0xe8cba8, bands: true, glow: 0,\n    source: 'NASA 팩트시트, 평균 반지름 69,911 km',\n  },\n  saturn: {\n    name: '토성', kind: 'planet', radiusM: 58_232 * KM,\n    color: 0xe3d5a6, atmosphere: 0xefe4bd, bands: true, glow: 0,\n    // 고리: 안쪽 74,500 km ~ 바깥쪽 140,220 km (A 고리 바깥 경계)\n    ring: { innerM: 74_500 * KM, outerM: 140_220 * KM, color: 0xcfc3a0 },\n    source: 'NASA 팩트시트, 평균 반지름 58,232 km / 고리 A 바깥 경계 140,220 km',\n  },\n  neptune: {\n    name: '해왕성', kind: 'planet', radiusM: 24_622 * KM,\n    color: 0x3b6fd4, atmosphere: 0x6f9df0, glow: 0,\n    source: 'NASA 팩트시트, 평균 반지름 24,622 km',\n  },\n  sun: {\n    name: '태양', kind: 'star', radiusM: 695_700 * KM,\n    color: 0xfff2b0, glow: 0xffb347, glowScale: 2.6,\n    source: 'IAU 공칭 태양 반지름 695,700 km',\n  },\n\n  // ---- 근처 별 ----\n  proxima: {\n    name: '프록시마 센타우리', kind: 'star', radiusM: 0.1542 * 695_700 * KM,\n    color: 0xff7b4a, glow: 0xff5a2b, glowScale: 3.0,\n    source: '반지름 0.1542 R☉ (적색왜성 M5.5Ve)',\n  },\n  sirius: {\n    name: '시리우스', kind: 'star', radiusM: 1.711 * 695_700 * KM,\n    color: 0xdbe9ff, glow: 0x9dc4ff, glowScale: 3.2,\n    source: '시리우스 A 반지름 1.711 R☉ (A1V)',\n  },\n  vega: {\n    name: '베가', kind: 'star', radiusM: 2.362 * 695_700 * KM,\n    color: 0xe8f0ff, glow: 0xa8c8ff, glowScale: 3.2,\n    source: '베가 평균 반지름 약 2.362 R☉ (A0V, 빠른 자전으로 편평)',\n  },\n\n  // ---- 은하 규모 ----\n  orion: {\n    name: '오리온 성운', kind: 'nebula', radiusM: 12 * LY,\n    displayRadiusM: 4 * LY,     // 실제 지름 약 24광년. 화면에서는 앞부분만 채우도록 줄여 그린다\n    color: 0xff8fb0, glow: 0x7ad0ff, glowScale: 1.8,\n    source: '지름 약 24광년 (메시에 42)',\n  },\n  'galactic-center': {\n    name: '은하 중심', kind: 'galaxy', radiusM: 300 * LY,\n    displayRadiusM: 60 * LY,\n    color: 0xffd9a0, glow: 0xffb35c, glowScale: 2.2,\n    source: '중심 팽대부의 밝은 핵 영역을 반지름 수백 광년으로 근사',\n  },\n\n  // ---- 은하 밖 ----\n  andromeda: {\n    name: '안드로메다 은하', kind: 'galaxy', radiusM: 110_000 * LY,\n    displayRadiusM: 20_000 * LY,\n    color: 0xcfd8ff, glow: 0x8aa0ff, glowScale: 2.0,\n    disk: true,\n    source: '지름 약 220,000광년 (M31)',\n  },\n};\n\n/**\n * 목적지 id로 표시 데이터를 얻는다. 없으면 회색 구로 대신한다.\n * @param {string} id  destinations.js의 id\n */\nexport function getBodyVisual(id) {\n  return CELESTIAL_BODIES[id] ?? {\n    name: '목적지', kind: 'planet', radiusM: 6_371 * KM, color: 0x8a8f9c, glow: 0,\n  };\n}\n\n/**\n * 고체 표면이 있어 착륙 장면을 만들 수 있는 천체인가 (D-61).\n * 가스행성·항성·성운·은하는 내려앉을 표면이 없으므로 근접 통과로 처리한다.\n * @param {object} visual\n */\nexport function isLandable(visual) {\n  return Boolean(visual?.landable);\n}\n\n/**\n * 화면에 그릴 반지름 (m). 성운·은하는 줄여 그린 값을 쓴다.\n * @param {object} visual\n */\nexport function displayRadius(visual) {\n  return visual.displayRadiusM ?? visual.radiusM;\n}\n", "src/physics/landingGuidance.js": "// 재착륙 유도 (13단계)\n// 공식과 근거: docs/03_physics.md 6.5절. 세 구간: 부스트백 연소 → 자유 낙하 → 착륙 연소\n// 화면(DOM)을 다루지 않는다. 분리된 물체(body)의 상태를 받아 이번 적분 간격에 낼 추력 가속도를 돌려준다.\n//\n// 근사: 남은 낙하 시간과 낙하 지점 예측에는 국소 평면(평평한 지면, 일정 중력) 근사를 쓴다.\n//       부스터 고도(수십~수백 km)에서는 지구 곡률의 영향이 작아 유도 목적으로 충분하다.\n// 설계 (D-41: 착륙은 항상 성공하도록):\n//   - 부스트백은 수평 속도를 \"목표 지점에 떨어질 값\"으로 맞춘다. 무인선 착륙 단은 목표가 정해져 있지 않으므로\n//     수평 속도를 0으로 만든 뒤, 그 자리 바로 아래를 목표(무인선 위치)로 삼는다.\n//   - 착륙 연소 시작 고도는 계획 감속도(planDecelG)로 계산하고, 실제 연소는 그보다 큰 상한(landingMaxG)까지 낼 수 있어\n//     적분 오차나 중력 변화가 있어도 지면 위에서 멈출 수 있다.\n//   - 마지막 100 m는 고도에 비례하는 하강 속도로 부드럽게 내려와 접지 속도가 3 m/s 이하가 된다.\n//   - 착륙 연소 중 수평은 위치 오차와 수평 속도를 함께 줄이는 비례-미분 제어로 목표 위에 맞춘다.\n// 단위: m, m/s, kg, N, s\n\nimport { EARTH_GM, EARTH_RADIUS, STANDARD_GRAVITY } from \"__MOD__src/data/constants.js__END__\";\nimport { GUIDANCE } from \"__MOD__src/data/landingSites.js__END__\";\n\nconst g0 = STANDARD_GRAVITY;\n\n/**\n * 고도 h, 수직 속도 vr(위쪽 +), 중력 g 에서 지면까지 걸리는 시간. h + vr·t − ½g·t² = 0 의 양의 근\n */\nexport function timeToGround(h, vr, g) {\n  const disc = vr * vr + 2 * g * h;\n  if (disc <= 0 || h <= 0) return 0;\n  return (vr + Math.sqrt(disc)) / g;\n}\n\n/**\n * 착륙 연소를 시작해야 하는 고도: h = v² / (2·(a − g))  (docs/03_physics.md 6.5절)\n */\nexport function landingBurnAltitude(speedDown, decel, g) {\n  if (decel <= g) return Infinity;\n  return (speedDown * speedDown) / (2 * (decel - g));\n}\n\n/**\n * 물체의 국소 좌표값을 계산한다.\n * @returns {{ rNorm, up, east, alt, vr, vt, s, g }}\n *   vr: 수직 속도(위 +), vt: 수평 속도(진행 방향 +), s: 발사대에서 진행 방향으로 잰 지표 거리\n */\nexport function localFrame(body) {\n  const rNorm = Math.hypot(body.r.x, body.r.y);\n  const up = { x: body.r.x / rNorm, y: body.r.y / rNorm };\n  const east = { x: up.y, y: -up.x };\n  const alt = rNorm - EARTH_RADIUS;\n  const vr = body.v.x * up.x + body.v.y * up.y;\n  const vt = body.v.x * east.x + body.v.y * east.y;\n  const s = EARTH_RADIUS * Math.atan2(body.r.x, body.r.y);\n  const g = EARTH_GM / (rNorm * rNorm);\n  return { rNorm, up, east, alt, vr, vt, s, g };\n}\n\n/**\n * 지금 상태에서 아무 것도 하지 않으면 떨어질 지표 거리 (탄도 예측)\n */\nexport function predictedDownrange(body) {\n  const f = localFrame(body);\n  return f.s + f.vt * timeToGround(f.alt, f.vr, f.g);\n}\n\nconst clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\n\n/**\n * 이번 간격에 물체가 낼 추력 가속도를 정한다. body.guidance 에 단계 상태를 저장한다.\n * @param {object} body  { r, v, mass, dryMass, propellant, engines, targetDownrange, guidance }\n *   targetDownrange 가 null 이면(무인선) 부스트백이 끝난 자리 아래를 목표로 정한다.\n * @param {number} h     적분 간격 (s)\n * @returns {{ ax: number, ay: number, thrust: number, landed: boolean }}\n */\nexport function guideBody(body, h) {\n  if (!body.guidance) body.guidance = { phase: 'coast', timer: 0 };\n  const gd = body.guidance;\n  const f = localFrame(body);\n  const maxThrust = body.engines.count * body.engines.thrustVacuumN;\n  const maxAccel = maxThrust / body.mass;\n  const lateralCap = GUIDANCE.lateralMaxG * g0;\n\n  let aUp = 0;     // 수직 방향 추력 가속도 (+ 위)\n  let aEast = 0;   // 수평 방향 추력 가속도 (+ 진행 방향)\n  let landed = false;\n\n  // 낙하 중 수평 보정: 탄도 예측으로 목표에 떨어질 수평 속도를 맞춘다\n  function ballisticCorrection() {\n    if (body.targetDownrange == null) return 0;\n    const tf = timeToGround(f.alt, f.vr, f.g);\n    if (tf < 1) return 0;\n    const vtRequired = (body.targetDownrange - f.s) / tf;\n    return clamp((vtRequired - f.vt) / h, -lateralCap, lateralCap);\n  }\n\n  // 착륙 연소 중 수평 보정: 위치 오차를 줄이는 방향의 목표 속도로, 속도를 부드럽게 맞춘다 (비례-미분)\n  function terminalCorrection() {\n    if (body.targetDownrange == null) return 0;\n    const error = body.targetDownrange - f.s;\n    const vtDesired = clamp(error / GUIDANCE.terminalPositionTau, -GUIDANCE.terminalMaxLateralSpeed, GUIDANCE.terminalMaxLateralSpeed);\n    return clamp((vtDesired - f.vt) / GUIDANCE.terminalVelocityTau, -lateralCap, lateralCap);\n  }\n\n  switch (gd.phase) {\n    case 'coast':\n      gd.timer += h;\n      if (gd.timer >= GUIDANCE.coastSeconds) gd.phase = 'boostback';\n      break;\n\n    case 'boostback': {\n      // 목표가 있으면 그 지점에 떨어질 수평 속도로, 없으면(무인선) 수평 속도 0으로\n      const tf = timeToGround(f.alt, f.vr, f.g);\n      const vtRequired = body.targetDownrange != null && tf > 0 ? (body.targetDownrange - f.s) / tf : 0;\n      const dv = vtRequired - f.vt;\n      if (Math.abs(dv) < 2) {\n        if (body.targetDownrange == null) body.targetDownrange = f.s;   // 무인선 위치 확정: 바로 아래\n        gd.phase = 'fall';\n      } else {\n        const cap = Math.min(GUIDANCE.boostbackMaxG * g0, maxAccel);\n        aEast = Math.sign(dv) * Math.min(cap, Math.abs(dv) / h);\n      }\n      break;\n    }\n\n    case 'fall': {\n      aEast = ballisticCorrection();\n      const speedDown = Math.max(0, -f.vr);\n      const planDecel = Math.min(GUIDANCE.planDecelG * g0, maxAccel);\n      const burnAlt = landingBurnAltitude(speedDown, planDecel, f.g) + GUIDANCE.landingMarginM;\n      if (f.vr < 0 && f.alt <= burnAlt) gd.phase = 'landing';\n      break;\n    }\n\n    case 'landing': {\n      const speedDown = Math.max(0, -f.vr);\n      const cap = Math.min(GUIDANCE.landingMaxG * g0, maxAccel);\n      if (f.alt > GUIDANCE.finalApproachM) {\n        // 호버슬램: 지면(여유 고도)에서 정확히 멈추는 연속 감속 v² / (2h), 여기에 중력을 더해 추력으로 낸다\n        const hEff = Math.max(f.alt - GUIDANCE.finalApproachM * 0.5, 1);\n        const needed = (speedDown * speedDown) / (2 * hEff);\n        aUp = clamp(f.g + needed, 0, cap);\n      } else {\n        // 최종 접근: 수평이 목표 위에 맞고 수평 속도가 작을 때만 내려간다. 아니면 고도를 유지(호버)하며 먼저 정렬한다.\n        const error = body.targetDownrange == null ? 0 : body.targetDownrange - f.s;\n        const aligned = Math.abs(error) <= GUIDANCE.alignPositionM && Math.abs(f.vt) <= GUIDANCE.alignSpeed;\n        const vDesired = aligned ? Math.max(GUIDANCE.finalMinDescent, GUIDANCE.finalDescentRate * f.alt) : 0;\n        // 하강 속도 오차를 줄이는 가속도. speedDown은 아래 +, vr은 위 +\n        aUp = clamp(f.g + (speedDown - vDesired) * GUIDANCE.finalGain + Math.max(0, f.vr) * GUIDANCE.finalGain * -1, 0, cap);\n      }\n      aEast = terminalCorrection();\n      if (f.alt <= GUIDANCE.touchdownAltitude && speedDown <= GUIDANCE.touchdownSpeed && Math.abs(f.vt) <= GUIDANCE.touchdownSpeed) {\n        landed = true;\n        gd.phase = 'landed';\n      }\n      break;\n    }\n\n    default:\n      break;\n  }\n\n  const ax = aUp * f.up.x + aEast * f.east.x;\n  const ay = aUp * f.up.y + aEast * f.east.y;\n  const thrust = Math.hypot(aUp, aEast) * body.mass;\n  return { ax, ay, thrust, landed };\n}\n\n/**\n * 천체 표면 착륙의 강하 프로파일 (17단계, D-61).\n * 일정한 감속도로 내려와 접지 속도가 `touchdown`이 되도록 한 간단한 모형이다.\n *   고도 h(t) = h₀·(1 − t)²   (t = 0 시작, t = 1 접지)\n *   하강 속도 v(t) = −dh/dt · (1/T) = 2·h₀·(1 − t) / T   → 접지에서 0에 가까워진다\n * 실제 하강 시간 T는 화면 재생 시간이 아니라 \"그 천체에서 h₀만큼 자유낙하했을 때 걸릴 시간\"을 쓴다.\n *   자유낙하 시간 = √(2h₀/g). 중력이 약한 달은 느긋하게, 화성은 조금 빠르게 내려온다.\n * @param {number} t          0(시작) ~ 1(접지)\n * @param {number} startAltitude  시작 고도 (m)\n * @param {number} gravity    그 천체의 표면 중력 (m/s²)\n * @param {number} touchdown  접지 속도 (m/s)\n * @returns {{ altitude: number, speed: number, thrust: number, seconds: number, duration: number }}\n */\nexport function descentProfile(t, startAltitude, gravity, touchdown = 1.5) {\n  const p = Math.max(0, Math.min(t, 1));\n  const duration = Math.sqrt((2 * startAltitude) / Math.max(gravity, 0.01));\n  const altitude = startAltitude * (1 - p) ** 2;\n  const speed = (2 * startAltitude * (1 - p)) / duration + touchdown * p;\n  // 추력: 감속에 필요한 몫. 자유낙하보다 느리게 내려오려면 계속 태워야 한다 (0~1로 정규화)\n  const thrust = p >= 1 ? 0 : Math.min(0.35 + 0.65 * p, 1);\n  return { altitude, speed: p >= 1 ? touchdown : speed, thrust, seconds: duration * p, duration };\n}\n", "src/data/landingSites.js": "// 착륙장과 무인선 위치, 착륙 유도 매개변수 (13단계, D-23, D-44)\n// 근거: docs/05_data_reference.md 7절, docs/03_physics.md 6.5절\n// 발사 평면은 2차원(진행 방향 = 다운레인지)이므로 위치는 발사대에서 진행 방향으로 잰 거리(m)로 표현한다.\n\nexport const LANDING_SITES = {\n  // 측면 부스터: 발사장 근처 착륙장. 실제 케네디의 착륙 지대는 발사대에서 약 10 km 떨어져 있으나\n  // 발사 평면에 \"남쪽\"을 표현할 수 없어, 모든 발사장에서 진행 방향 2 km 지점에 가상 착륙장을 둔다 (D-44)\n  launch_site: { label: '착륙장', downrangeM: 2_000 },\n  // 중앙 코어: 바다 위 무인선. 위치는 분리 시점에 코어가 탄도 비행으로 떨어질 지점으로 정한다\n  // (실제로도 무인선을 코어의 예상 낙하 지점에 미리 보내 둔다). null = 계산으로 정함\n  drone_ship: { label: '무인선', downrangeM: null },\n};\n\n// 착륙 유도 매개변수. 물리 법칙이 아닌 조정값이며, 착륙이 항상 성공하도록 정했다 (D-41)\nexport const GUIDANCE = {\n  coastSeconds: 5,            // 분리 후 부스트백 시작까지 관성 비행 (s)\n  boostbackMaxG: 3,           // 부스트백 최대 가속도 (g 배수)\n  planDecelG: 3,              // 착륙 연소 시작 고도를 계산할 때 쓰는 계획 감속도 (g 배수). 실제 상한보다 작게 두어 여유 확보\n  landingMaxG: 4,             // 착륙 연소 최대 감속도 (g 배수)\n  lateralMaxG: 1.0,           // 낙하·착륙 중 수평 오차 보정 최대 가속도 (g 배수)\n  alignPositionM: 10,         // 최종 접근에서 하강을 시작하기 위한 수평 위치 오차 한도 (m)\n  alignSpeed: 3,              // 최종 접근에서 하강을 시작하기 위한 수평 속도 한도 (m/s)\n  landingMarginM: 200,        // 착륙 연소 시작 고도 여유 (m)\n  finalApproachM: 100,        // 이 고도(m) 아래에서는 부드러운 최종 접근\n  finalDescentRate: 0.15,     // 최종 접근 목표 하강 속도 = 고도 × 이 값 (1/s)\n  finalMinDescent: 1.5,       // 최종 접근 최소 하강 속도 (m/s)\n  finalGain: 2,               // 최종 접근 속도 오차 → 가속도 이득 (1/s)\n  terminalPositionTau: 15,    // 착륙 연소 중 위치 오차를 줄이는 시간 상수 (s)\n  terminalVelocityTau: 4,     // 착륙 연소 중 수평 속도를 맞추는 시간 상수 (s)\n  terminalMaxLateralSpeed: 120,// 착륙 연소 중 최대 수평 이동 속도 (m/s)\n  touchdownAltitude: 1.5,     // 접지 판정 고도 (m)\n  touchdownSpeed: 3,          // 접지 판정 속도 (m/s): 수직·수평 모두 이 이하\n};\n", "src/launch/landingTarget.js": "// 보조 화면이 비출 착륙 대상 고르기 (14단계, D-42)\n// 역할: 분리된 물체 목록에서 \"가장 가까운 착륙 대상\"을 하나 고르고, 그 물체의 고도·속도·착륙 단계 이름을 알려준다.\n// Three.js와 DOM을 모른다. 순수 계산이므로 tests/physics.test.js에서 그대로 검증한다.\n//\n// D-42: 보조 화면은 1개, 가장 가까운 착륙 대상으로 자동 전환한다.\n//   \"가장 가까운\"은 접지까지 남은 고도가 가장 낮은, 아직 내려오는 중인 회수 단으로 본다.\n//   모두 내려앉은 뒤에는 마지막으로 착륙한 단을 계속 비춘다 (사용자 선택: 분리 후 계속 표시).\n\nimport { EARTH_RADIUS } from \"__MOD__src/data/constants.js__END__\";\n\n/** 물체의 고도 (m) */\nexport function bodyAltitude(body) {\n  return Math.hypot(body.r.x, body.r.y) - EARTH_RADIUS;\n}\n\n/** 물체의 속도 크기 (m/s) */\nexport function bodySpeed(body) {\n  return Math.hypot(body.v.x, body.v.y);\n}\n\n/**\n * 보조 화면이 비출 물체를 고른다.\n * @param {object[]} bodies  sim.bodies (분리된 물체 목록)\n * @returns {object | null}  회수 단이 하나도 없으면 null\n */\nexport function selectLandingTarget(bodies) {\n  const recoverable = bodies.filter((b) => b.recovery?.enabled);\n  if (recoverable.length === 0) return null;\n\n  // 1순위: 아직 내려오는 중인 단 가운데 고도가 가장 낮은 것\n  const falling = recoverable.filter((b) => b.status === 'falling');\n  if (falling.length > 0) {\n    return falling.reduce((best, b) => (bodyAltitude(b) < bodyAltitude(best) ? b : best));\n  }\n\n  // 2순위: 모두 끝났으면 가장 나중에 내려앉은 단을 계속 비춘다\n  return recoverable.reduce((best, b) => ((b.landedAt ?? -Infinity) > (best.landedAt ?? -Infinity) ? b : best));\n}\n\n// 착륙 유도 단계(physics/landingGuidance.js의 guidance.phase) → 화면에 쓸 한국어 이름\nconst PHASE_LABELS = {\n  coast: '관성 비행',\n  boostback: '부스트백 연소',\n  fall: '자유 낙하',\n  landing: '착륙 연소',\n  landed: '착륙 완료',\n};\n\n/**\n * 착륙 단계 이름. 이미 접지했으면 결과(착륙/충돌)를 우선해서 보여준다.\n * @param {object | null} body\n * @returns {string}\n */\nexport function landingPhaseLabel(body) {\n  if (!body) return '-';\n  if (body.status === 'landed') return '착륙 완료';\n  if (body.status === 'impact') return '지면 충돌';\n  return PHASE_LABELS[body.guidance?.phase] ?? '분리 직후';\n}\n", "src/data/falconHeavy.js": "// 팔콘 헤비 기본 로켓 제원 (11단계, D-22, D-43)\n// 값과 출처: docs/05_data_reference.md 6절 (모두 개략값)\n// 형식: 로켓 제원 JSON 계약(docs/08_rocket_design_handoff.md 6절)의 stages[] / geometry / payloadMassKg 와 동일.\n//       16단계에서 설계 프로그램이 내보낸 JSON으로 그대로 바꿔 끼울 수 있게 하기 위함이다.\n// 단위: kg, N, s, m\n\nexport const FALCON_HEAVY = {\n  formatVersion: 1,\n  name: '팔콘 헤비 (기본)',\n  payloadMassKg: 10_000,\n  stages: [\n    {\n      id: 'booster-left',\n      label: '측면 부스터 (좌)',\n      role: 'parallel',\n      separationOrder: 1,\n      dryMassKg: 22_200,\n      propellantMassKg: 411_000,\n      engines: { count: 9, thrustSeaLevelN: 845_000, thrustVacuumN: 914_000, ispSeaLevelS: 282, ispVacuumS: 311 },\n      recovery: { enabled: true, target: 'launch_site', reservePropellantFraction: 0.05 },\n    },\n    {\n      id: 'booster-right',\n      label: '측면 부스터 (우)',\n      role: 'parallel',\n      separationOrder: 1,\n      dryMassKg: 22_200,\n      propellantMassKg: 411_000,\n      engines: { count: 9, thrustSeaLevelN: 845_000, thrustVacuumN: 914_000, ispSeaLevelS: 282, ispVacuumS: 311 },\n      recovery: { enabled: true, target: 'launch_site', reservePropellantFraction: 0.05 },\n    },\n    {\n      id: 'core',\n      label: '중앙 코어',\n      role: 'serial',\n      separationOrder: 2,\n      dryMassKg: 22_200,\n      propellantMassKg: 411_000,\n      engines: { count: 9, thrustSeaLevelN: 845_000, thrustVacuumN: 914_000, ispSeaLevelS: 282, ispVacuumS: 311 },\n      throttleWhileBoosters: 0.6,   // 부스터가 붙어 있는 동안 추력을 낮춰 연료를 아낀다\n      recovery: { enabled: true, target: 'drone_ship', reservePropellantFraction: 0.05 },\n    },\n    {\n      id: 'upper',\n      label: '2단',\n      role: 'serial',\n      separationOrder: 3,\n      dryMassKg: 4_000,\n      propellantMassKg: 111_000,\n      engines: { count: 1, thrustSeaLevelN: 0, thrustVacuumN: 981_000, ispSeaLevelS: 0, ispVacuumS: 348 },\n      recovery: { enabled: false },\n    },\n  ],\n  // 3D 표시용 형상. 위치는 발사대 바닥 중심 기준(m), size는 [지름, 높이, 지름]\n  geometry: {\n    parts: [\n      { partId: 'booster-left-body',  type: 'tank',    stageId: 'booster-left',  position: [-3.7, 21, 0], rotation: [0, 0, 0], size: [3.7, 42, 3.7] },\n      { partId: 'booster-left-nose',  type: 'fairing', stageId: 'booster-left',  position: [-3.7, 44, 0], rotation: [0, 0, 0], size: [3.7, 4, 3.7] },\n      { partId: 'booster-right-body', type: 'tank',    stageId: 'booster-right', position: [3.7, 21, 0],  rotation: [0, 0, 0], size: [3.7, 42, 3.7] },\n      { partId: 'booster-right-nose', type: 'fairing', stageId: 'booster-right', position: [3.7, 44, 0],  rotation: [0, 0, 0], size: [3.7, 4, 3.7] },\n      { partId: 'core-body',          type: 'tank',    stageId: 'core',          position: [0, 21, 0],    rotation: [0, 0, 0], size: [3.7, 42, 3.7] },\n      { partId: 'upper-body',         type: 'tank',    stageId: 'upper',         position: [0, 49, 0],    rotation: [0, 0, 0], size: [3.7, 14, 3.7] },\n      { partId: 'fairing',            type: 'fairing', stageId: 'payload',       position: [0, 62.5, 0],  rotation: [0, 0, 0], size: [5.2, 13, 5.2] },\n    ],\n  },\n};\n", "src/data/organisms.js": "// 비교 생물 5종의 기초 데이터 (7단계)\n// 값과 출처: docs/05_data_reference.md 5절, 결정 D-13, D-37, D-38\n// 수명 저장 단위: 초 (1년 = 365.25일)\n\nimport { SECONDS_PER_YEAR } from \"__MOD__src/data/constants.js__END__\";\n\nconst DAY = 86_400;\n\nexport const ORGANISMS = [\n  {\n    id: 'mayfly',\n    name: '하루살이',\n    icon: '🪰',\n    lifespan: 1 * DAY,\n    lifespanLabel: '약 1일 (성충 기준)',\n    ageUnit: 'hour',           // 출발 나이 입력 단위. 수명이 하루라 시간 단위가 알맞다\n    source: '성충 단계 기준. 유충 단계(수개월~2년)는 제외',\n  },\n  {\n    id: 'dog',\n    name: '개',\n    icon: '🐕',\n    lifespan: 13 * SECONDS_PER_YEAR,\n    lifespanLabel: '약 13년',\n    ageUnit: 'year',\n    source: '중형견 평균 수명 10~13년의 상한',\n  },\n  {\n    id: 'human',\n    name: '사람',\n    icon: '🧑',\n    lifespan: 80 * SECONDS_PER_YEAR,\n    lifespanLabel: '약 80년',\n    ageUnit: 'year',\n    source: '세계 평균 약 73년, 한국 약 83년 사이의 대표값',\n  },\n  {\n    id: 'tortoise',\n    name: '갈라파고스 코끼리거북',\n    icon: '🐢',\n    lifespan: 150 * SECONDS_PER_YEAR,\n    lifespanLabel: '약 150년',\n    ageUnit: 'year',\n    source: '사육 기록 최고 170년 이상, 일반적으로 100~150년',\n  },\n  {\n    id: 'greenland-shark',\n    name: '그린란드 상어',\n    icon: '🦈',\n    lifespan: 400 * SECONDS_PER_YEAR,\n    lifespanLabel: '약 400년',\n    ageUnit: 'year',\n    source: 'Nielsen 외 2016 (Science), 추정 272~512년의 중앙값 근사',\n  },\n];\n\n// 출발 나이 입력 단위 → 초\nexport const AGE_UNIT_SECONDS = {\n  hour: 3_600,\n  year: SECONDS_PER_YEAR,\n};\n\nexport const AGE_UNIT_LABEL = {\n  hour: '시간',\n  year: '년',\n};\n", "src/physics/ageGap.js": "// 시간 지연을 \"얼마나 덜 늙는가\"로 바꿔 주는 계산 (21단계, D-97)\n// 역할: 이 프로젝트의 핵심 질문 — \"그래서 얼마나 차이가 나는데?\" — 에 답할 수 있는 값을 만든다.\n// 화면(DOM)을 모른다. 검증은 tests/physics.test.js.\n//\n// 이 프로젝트가 하려는 것:\n//   빛의 속도는 누가 재도 똑같다(광속 불변). 그러려면 빠르게 움직이는 쪽의 시간이 느리게 흘러야 한다.\n//   그 \"느리게\"가 얼마인지는 γ = 1/√(1−β²) 한 줄로 나오지만, 숫자만 봐서는 감이 안 온다.\n//   그래서 \"덜 늙은 시간\"을 생물의 수명에 견주어 본다. 하루살이 수명 몇 배인지, 사람 수명의 몇 %인지.\n\n/**\n * 지구와 우주선의 경과 시간 차이를 여러 각도로 풀어 준다.\n * @param {{ earthTime: number, shipTime: number }} result  계산 결과 (초)\n * @param {object[]} organisms  data/organisms.js 항목들 (lifespan: 초)\n * @returns {{\n *   gap: number,                한 번 다녀왔을 때 덜 늙은 시간 (초)\n *   ratio: number,              지구 시간 대비 비율 (0~1)\n *   perYear: number,            지구에서 1년이 흐를 때 덜 늙는 시간 (초)\n *   equivalents: {organism: object, times: number}[]  각 생물 수명의 몇 배인지\n * }}\n */\nexport function ageGap(result, organisms = []) {\n  const earthTime = Math.max(result?.earthTime ?? 0, 0);\n  const shipTime = Math.max(result?.shipTime ?? 0, 0);\n  const gap = Math.max(earthTime - shipTime, 0);\n  const ratio = earthTime > 0 ? gap / earthTime : 0;\n  return {\n    gap,\n    ratio,\n    // 여행 길이와 상관없이 \"이 속도라면 1년에 얼마\"인지도 알려 준다\n    perYear: ratio * 31_557_600,\n    equivalents: organisms.map((organism) => ({\n      organism,\n      times: organism.lifespan > 0 ? gap / organism.lifespan : 0,\n    })),\n  };\n}\n\n/**\n * 덜 늙은 시간을 가장 잘 설명해 주는 생물 하나를 고른다.\n * 기준: 그 생물 수명의 0.02배 ~ 5000배 사이에 드는 것 중, 배수가 1에 가장 가까운 것.\n * (하루살이 수명의 3배, 개 수명의 28% 같은 표현이 100만 배보다 훨씬 와닿는다)\n * @param {{ equivalents: {organism: object, times: number}[] }} gapInfo\n * @returns {{organism: object, times: number} | null}\n */\nexport function bestEquivalent(gapInfo) {\n  const candidates = (gapInfo?.equivalents ?? []).filter((e) => e.times >= 0.02 && e.times <= 5000);\n  if (candidates.length === 0) return null;\n  return candidates.reduce((best, e) => (\n    Math.abs(Math.log(e.times)) < Math.abs(Math.log(best.times)) ? e : best\n  ));\n}\n", "src/physics/route.js": "// 경유 여행 경로 (21단계, D-95)\n// 역할: 지구 → (경유지) → 목적지 → 지구 처럼 여러 구간으로 나뉜 여정을 구간 목록으로 만든다.\n// 화면도 Three.js도 모른다. 검증은 tests/physics.test.js.\n//\n// 두 천체 사이의 거리에 대하여:\n//   이 프로젝트의 자료(`src/data/destinations.js`)에는 **지구에서 잰 평균 거리**만 있다.\n//   두 천체 사이의 실제 거리는 그때그때의 위치에 따라 달라지고, 최소 |d₁ − d₂| 에서 최대 d₁ + d₂ 사이다.\n//   여기서는 여행 계획에서 흔히 쓰는 **가장 가까울 때의 거리 |d₁ − d₂|** 를 쓴다.\n//   (예: 화성 d=2.25e11 m, 목성 d=7.78e11 m → 화성에서 목성까지 5.53e11 m)\n//   실제 임무는 두 천체가 가까워지는 시기(발사 창)를 골라 떠나므로, 이 값이 계획 거리에 가깝다.\n//   지구가 한쪽 끝이면 그냥 그 천체의 거리다.\n\n/**\n * 두 지점 사이의 거리 (m).\n * @param {number} d1  지구에서 잰 거리 (m). 지구 자신은 0\n * @param {number} d2\n */\nexport function legDistance(d1, d2) {\n  return Math.abs(d1 - d2);\n}\n\n/**\n * 여정을 구간으로 나눈다.\n * @param {{\n *   destinationDistance: number, destinationName: string,\n *   waypointDistance?: number|null, waypointName?: string|null,\n *   roundTrip: boolean,\n * }} spec\n * @returns {{ legs: {from: string, to: string, distance: number}[], totalDistance: number }}\n */\nexport function buildRoute(spec) {\n  const {\n    destinationDistance, destinationName,\n    waypointDistance = null, waypointName = null,\n    roundTrip = false,\n  } = spec;\n\n  // 들를 곳들을 순서대로: 지구 → (경유지) → 목적지 → (지구)\n  const stops = [{ name: '지구', distance: 0 }];\n  if (waypointDistance != null && waypointName) {\n    stops.push({ name: waypointName, distance: waypointDistance });\n  }\n  stops.push({ name: destinationName, distance: destinationDistance });\n  if (roundTrip) stops.push({ name: '지구', distance: 0 });\n\n  const legs = [];\n  for (let i = 0; i < stops.length - 1; i += 1) {\n    legs.push({\n      from: stops[i].name,\n      to: stops[i + 1].name,\n      distance: legDistance(stops[i].distance, stops[i + 1].distance),\n    });\n  }\n  return { legs, totalDistance: legs.reduce((sum, l) => sum + l.distance, 0) };\n}\n", "src/physics/launchDynamics.js": "// 발사 운동 시뮬레이션 (11단계, 12단계에서 분리 물체 추가)\n// 공식과 근거: docs/03_physics.md 6.2절(운동 방정식), 6.3절(단 분리), 6.6절(시간 적분)\n// 화면(DOM)을 다루지 않는다. 입력은 로켓 제원(stages[] 형식)이고, step(dt)로 상태를 전진시킨다.\n//\n// 좌표계: 지구 중심 원점, 발사 평면 2차원. 발사장은 (0, R)에 있고 +x 가 진행 방향(다운레인지).\n//   지구 자전은 반영하지 않는다 (단순화, P-04). 공기 저항은 계산하지 않는다 (D-21).\n// 단위: m, m/s, kg, N, s\n\nimport { EARTH_GM, EARTH_RADIUS, STANDARD_GRAVITY } from \"__MOD__src/data/constants.js__END__\";\nimport { LANDING_SITES } from \"__MOD__src/data/landingSites.js__END__\";\nimport { guideBody, predictedDownrange } from \"__MOD__src/physics/landingGuidance.js__END__\";\n\n// 대기압에 따른 추력 변화: T(h) = T_진공 − (T_진공 − T_해수면) · exp(−h / H). H는 대기 척도 높이 약 8,400 m\nconst ATMOSPHERE_SCALE_HEIGHT = 8_400;\n\n/**\n * 기본 피치 프로그램 (D-40, 21단계에서 D-92로 다시 맞춤): 발사 12초까지 수직, 이후 서서히 수평 쪽으로.\n * 반환값은 국소 수직에서 진행 방향으로 기울인 각도(라디안). 0 = 수직, π/2 = 수평\n *\n * 값의 근거: 팔콘 헤비 제원으로 여러 조합을 돌려 **실제 저궤도 투입과 같은 결과**가 나오는 값을 골랐다 (P-05).\n *   12초 · 170초 · 86° → 궤도 진입 시점에 고도 235 km, 속도 7.77 km/s, 상승 속도 거의 0.\n *   그 고도의 원궤도 속도(7.77 km/s)와 일치하므로 실제로 원에 가까운 궤도에 오른다.\n *   너무 빨리 눕히면(140초 이하) 수직 속도를 잃고 추락하고, 너무 늦게 눕히면(200초 이상)\n *   위로만 솟아 고도 400 km를 넘으면서도 옆으로 도는 속도를 얻지 못한다.\n *\n * 왜 눕히는가: 궤도에 오른다는 것은 \"높이 올라가는 것\"이 아니라 \"옆으로 아주 빨라지는 것\"이다.\n *   그래서 로켓은 처음에만 수직으로 오르고 곧 옆으로 기울여, 고도는 완만해지고 속도만 계속 붙는다.\n *   화면의 고도가 후반에 천천히 오르는 것은 이 때문이다 (docs/03_physics.md 6.2절).\n *\n * @param {number} t  발사 후 경과 시간 (s)\n */\nexport function defaultPitchProgram(t) {\n  const VERTICAL_UNTIL = 12;\n  const TURN_DURATION = 170;\n  const FINAL_PITCH = (86 * Math.PI) / 180;\n  if (t < VERTICAL_UNTIL) return 0;\n  const k = Math.min((t - VERTICAL_UNTIL) / TURN_DURATION, 1);\n  // 부드럽게 (처음엔 천천히, 끝에서 천천히)\n  const smooth = k * k * (3 - 2 * k);\n  return FINAL_PITCH * smooth;\n}\n\n/**\n * 그 고도에서 원궤도를 도는 데 필요한 속도 (m/s). v = √(GM / r)\n * @param {number} altitudeM  고도 (m)\n */\nexport function circularOrbitSpeed(altitudeM) {\n  return Math.sqrt(EARTH_GM / (EARTH_RADIUS + Math.max(altitudeM, 0)));\n}\n\n// 2단 연소 종료(SECO) 판정 기준: 이 고도를 넘고 원궤도 속도에 도달하면 엔진을 끈다 (D-92)\nconst SECO_MIN_ALTITUDE = 120_000;\n\n/**\n * 고도에 따른 엔진 1개의 추력\n */\nfunction thrustAtAltitude(engine, altitude) {\n  const h = Math.max(altitude, 0);\n  const f = Math.exp(-h / ATMOSPHERE_SCALE_HEIGHT);\n  return engine.thrustVacuumN - (engine.thrustVacuumN - engine.thrustSeaLevelN) * f;\n}\n\n/**\n * 발사 시뮬레이션을 만든다.\n * @param {object} spec  로켓 제원 (data/falconHeavy.js 형식: payloadMassKg, stages[])\n * @param {object} [options]\n * @param {(t: number) => number} [options.pitchProgram]  피치 각도 함수\n * @param {boolean} [options.gravity=true]  false면 중력을 끈다 (치올콥스키 검증용)\n * @param {number} [options.stepSeconds=1/60]  적분 시간 간격\n */\nexport function createLaunchSimulation(spec, options = {}) {\n  const pitchProgram = options.pitchProgram ?? defaultPitchProgram;\n  const gravityOn = options.gravity ?? true;\n  const stepSeconds = options.stepSeconds ?? 1 / 60;\n\n  // 단 상태 복사 (원본 제원은 바꾸지 않는다)\n  const stages = spec.stages.map((s) => ({\n    id: s.id,\n    label: s.label,\n    role: s.role,\n    order: s.separationOrder,\n    dryMass: s.dryMassKg,\n    propellant: s.propellantMassKg,\n    initialPropellant: s.propellantMassKg,\n    engines: s.engines,\n    throttleWhileBoosters: s.throttleWhileBoosters ?? 1,\n    recovery: s.recovery ?? { enabled: false },\n    // 분리 시점: 회수 단은 착륙용 예비 추진제(reserve)가 남았을 때 분리된다\n    reserve: s.recovery?.enabled ? (s.recovery.reservePropellantFraction ?? 0) * s.propellantMassKg : 0,\n    attached: true,\n    burning: false,\n    separatedAt: null,\n  }));\n\n  const vehicle = {\n    r: { x: 0, y: EARTH_RADIUS },   // 위치 (m)\n    v: { x: 0, y: 0 },              // 속도 (m/s)\n    mass: 0,                        // 현재 총질량 (kg)\n    thrust: 0,                      // 현재 총 추력 (N)\n    pitch: 0,                       // 현재 피치 (rad)\n    dir: { x: 0, y: 1 },            // 추력 방향 단위벡터\n  };\n\n  let time = 0;\n  let complete = false;\n  let liftedOff = false;\n  const pendingEvents = [];\n\n  // 분리된 단(12단계): 각자 중력만 받으며 움직이는 독립 물체. 13단계에서 착륙 유도가 붙는다.\n  // { id, stageId, label, r, v, mass, propellant, recovery, status: 'falling' | 'landed' | 'impact',\n  //   landedAt: 접지 시각(s), landedDownrange, impactSpeed, guidance: { phase } }\n  const bodies = [];\n\n  function integrateBody(body, h) {\n    if (body.status !== 'falling' && body.status !== 'discarded') return;\n    const rNorm = Math.hypot(body.r.x, body.r.y);\n    const g = gravityOn ? EARTH_GM / (rNorm * rNorm) : 0;\n    let ax = -g * (body.r.x / rNorm);\n    let ay = -g * (body.r.y / rNorm);\n\n    // 회수 대상이면 착륙 유도가 추력 가속도를 더한다 (13단계)\n    let landed = false;\n    if (body.status === 'falling' && body.recovery?.enabled) {\n      const guide = guideBody(body, h);\n      ax += guide.ax;\n      ay += guide.ay;\n      body.thrust = guide.thrust;\n      landed = guide.landed;\n      // 추진제 소모: ṁ = T / (Isp·g₀). 예비 추진제가 바닥나도 착륙은 계속한다 (D-41: 착륙은 항상 성공).\n      // 공기 저항을 생략(D-21)하면 실제 5% 예비로는 부족하므로, 초과분은 기록만 한다\n      if (guide.thrust > 0) {\n        const burned = (guide.thrust / (body.engines.ispVacuumS * STANDARD_GRAVITY)) * h;\n        body.propellant -= burned;\n        body.propellantUsedForLanding = (body.propellantUsedForLanding ?? 0) + burned;\n        body.mass = body.dryMass + Math.max(body.propellant, 0);\n      }\n    } else {\n      body.thrust = 0;\n    }\n\n    body.v.x += ax * h;\n    body.v.y += ay * h;\n    body.r.x += body.v.x * h;\n    body.r.y += body.v.y * h;\n\n    const alt = Math.hypot(body.r.x, body.r.y) - EARTH_RADIUS;\n    if ((alt <= 0 || landed) && body.status === 'falling') {\n      const n = Math.hypot(body.r.x, body.r.y);\n      body.r.x *= EARTH_RADIUS / n;\n      body.r.y *= EARTH_RADIUS / n;\n      const speed = Math.hypot(body.v.x, body.v.y);\n      body.impactSpeed = speed;\n      body.v.x = 0;\n      body.v.y = 0;\n      body.thrust = 0;\n      body.status = landed ? 'landed' : 'impact';\n      body.landedAt = time;   // 접지 시각 (s). 보조 화면이 마지막으로 내려앉은 단을 고를 때 쓴다 (14단계)\n      body.landedDownrange = EARTH_RADIUS * Math.atan2(body.r.x, body.r.y);\n      pendingEvents.push({ type: body.status, stageId: body.stageId, label: body.label, time, speed });\n    }\n  }\n\n  function attachedMass() {\n    let m = spec.payloadMassKg;\n    for (const s of stages) if (s.attached) m += s.dryMass + s.propellant;\n    return m;\n  }\n\n  // 지금 연소 중이어야 할 단을 정한다 (docs/03_physics.md 6.3절의 순서)\n  // - 붙어 있는 병렬 단 중 가장 낮은 순서\n  // - 붙어 있는 직렬 단 중 가장 낮은 순서\n  function updateBurningSet() {\n    const attached = stages.filter((s) => s.attached);\n    const minOrder = Math.min(...attached.map((s) => s.order));\n    const serial = attached.filter((s) => s.role === 'serial');\n    const minSerialOrder = serial.length ? Math.min(...serial.map((s) => s.order)) : Infinity;\n    for (const s of stages) {\n      const shouldBurn = s.attached && s.propellant > s.reserve\n        && ((s.role === 'parallel' && s.order === minOrder) || (s.role === 'serial' && s.order === minSerialOrder));\n      if (shouldBurn && !s.burning) pendingEvents.push({ type: 'ignition', stageId: s.id, label: s.label, time });\n      s.burning = shouldBurn;\n    }\n  }\n\n  function altitude() {\n    return Math.hypot(vehicle.r.x, vehicle.r.y) - EARTH_RADIUS;\n  }\n\n  function boostersAttached() {\n    return stages.some((s) => s.attached && s.role === 'parallel');\n  }\n\n  updateBurningSet();\n  vehicle.mass = attachedMass();\n\n  /**\n   * 시뮬레이션을 dt초 전진시킨다. 내부에서는 stepSeconds 간격으로 여러 번 적분한다.\n   * @param {number} dt\n   * @returns {object[]} 이 동안 일어난 사건들 (ignition / separation / complete)\n   */\n  function step(dt) {\n    let remaining = dt;\n    while (remaining > 0) {\n      const h = Math.min(stepSeconds, remaining);\n      if (!complete) {\n        integrate(h);\n      } else {\n        // 우주선은 끝났어도 떨어지는 단들은 계속 움직인다\n        for (const body of bodies) integrateBody(body, h);\n        time += h;\n      }\n      remaining -= h;\n      if (complete && !bodies.some((b) => b.status === 'falling')) break;\n    }\n    const events = pendingEvents.splice(0);\n    return events;\n  }\n\n  function integrate(h) {\n    const alt = altitude();\n    const rNorm = Math.hypot(vehicle.r.x, vehicle.r.y);\n    const up = { x: vehicle.r.x / rNorm, y: vehicle.r.y / rNorm };          // 국소 수직\n    const east = { x: up.y, y: -up.x };                                        // 진행 방향(국소 수평)\n\n    // 추력 방향: 국소 수직에서 pitch만큼 진행 방향으로 기울임\n    const pitch = pitchProgram(time);\n    vehicle.pitch = pitch;\n    vehicle.dir = {\n      x: up.x * Math.cos(pitch) + east.x * Math.sin(pitch),\n      y: up.y * Math.cos(pitch) + east.y * Math.sin(pitch),\n    };\n\n    // 추력과 질량 유량\n    const boosters = boostersAttached();\n    let thrust = 0;\n    let massFlow = 0;\n    for (const s of stages) {\n      if (!s.burning) continue;\n      const throttle = (s.role === 'serial' && boosters) ? s.throttleWhileBoosters : 1;\n      const perEngine = thrustAtAltitude(s.engines, alt);\n      thrust += s.engines.count * perEngine * throttle;\n      // 질량 유량은 진공 값으로 정의된다: ṁ = T_진공 / (Isp_진공 · g₀)\n      const flow = s.engines.count * (s.engines.thrustVacuumN / (s.engines.ispVacuumS * STANDARD_GRAVITY)) * throttle;\n      const burned = Math.min(flow * h, s.propellant - s.reserve);\n      s.propellant -= burned;\n      massFlow += burned / h;\n    }\n    vehicle.thrust = thrust;\n    const mass = attachedMass();\n    vehicle.mass = mass;\n\n    // 가속도 = 추력/질량 · 방향 − GM/|r|² · r̂\n    let ax = (thrust / mass) * vehicle.dir.x;\n    let ay = (thrust / mass) * vehicle.dir.y;\n    if (gravityOn) {\n      const g = EARTH_GM / (rNorm * rNorm);\n      ax -= g * up.x;\n      ay -= g * up.y;\n    }\n\n    // 반음해 오일러: 속도를 먼저 갱신하고 그 속도로 위치 갱신\n    vehicle.v.x += ax * h;\n    vehicle.v.y += ay * h;\n    vehicle.r.x += vehicle.v.x * h;\n    vehicle.r.y += vehicle.v.y * h;\n\n    // 지면 처리: 발사 직후(추력 < 무게)에는 발사대에 붙어 있고, 비행 중에 지면 아래로 내려가면 추락으로 끝낸다\n    if (gr
